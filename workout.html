    openSheet(`
      <div class="eyebrow">3 of 4</div>
      <h2 class="font-display font-black text-2xl mt-1">How many days a week?</h2>
      <p class="text-sm text-[var(--text-dim)] mt-1.5">Be honest rather than optimistic. Three days you actually do beats six you skip.</p>
      <div class="space-y-2 mt-4">
        ${[[3,'Three days','Full body each time — the classic starting point'],
           [4,'Four days','Upper and lower, twice each'],
           [5,'Five days','Push, pull, legs and more'],
           [6,'Six days','Only if training is already a habit']].map(([v,t,d])=>
          `<button class="card p-4 w-full text-left" onclick="onbPick('days',${v},4)">
            <div class="font-bold text-sm">${t}</div><div class="text-xs text-[var(--text-dim)] mt-0.5">${d}</div></button>`).join('')}
      </div>`);
  }
  if (step === 4){
    openSheet(`
      <div class="eyebrow">4 of 4</div>
      <h2 class="font-display font-black text-2xl mt-1">What have you got?</h2>
      <p class="text-sm text-[var(--text-dim)] mt-1.5">Tap everything available to you. Anything you leave off gets swapped out of your plan.</p>
      <div class="space-y-2 mt-4">
        ${EQUIPMENT.map(e=>{
          const on = onb.kit.includes(e.id);
          return `<button class="card p-3.5 w-full flex items-center gap-3" onclick="onbKit('${e.id}')">
            <span class="text-lg">${e.icon}</span>
            <span class="flex-1 text-left font-bold text-sm">${e.label}</span>
            <span class="w-11 h-6 rounded-full relative flex-shrink-0" style="background:${on?'var(--accent)':'rgba(255,255,255,0.12)'};">
              <span class="absolute top-1 w-4 h-4 rounded-full bg-white" style="left:${on?'24px':'4px'};"></span></span>
          </button>`;
        }).join('')}
      </div>
      <button class="btn-accent w-full py-3.5 mt-4 font-bold" onclick="finishOnboarding()">Build my plan</button>`);
  }
}
function onbPick(field, val, next){
  onb[field] = val;
  if (field === 'exp' && !onb.kit.length) onb.kit = ['bodyweight','dumbbell','machine','cable','barbell'];
  startOnboarding(next);
}
function onbKit(id){
  if (onb.kit.includes(id)) onb.kit = onb.kit.filter(x=>x!==id);
  else onb.kit.push(id);
  startOnboarding(4);
}
function finishOnboarding(){
  if (!onb.kit.length) onb.kit = ['bodyweight'];
  store.equipment = onb.kit.slice();

  const onlyBody = onb.kit.length === 1 && onb.kit[0] === 'bodyweight';
  const noBarbell = !onb.kit.includes('barbell');
  const dumbbellOnly = onb.kit.every(k => k === 'dumbbell' || k === 'bodyweight');

  let plan = 'fullbody3';
  if (onlyBody) plan = 'home3';
  else if (dumbbellOnly) plan = 'dumbbell4';
  else if (onb.exp === 'new' && noBarbell) plan = 'machines3';
  else if (onb.goal === 'strength' && !noBarbell) plan = 'strength3';
  else if (onb.days >= 6) plan = 'ppl6';
  else if (onb.days === 5) plan = onb.goal === 'muscle' ? 'bro5' : 'ppl5';
  else if (onb.days === 4) plan = 'upperlower4';
  else plan = onb.exp === 'new' ? 'fullbody3' : 'fullbody3';

  store.plan = plan;
  store.overrides = {};
  store.beginnerMode = (onb.exp === 'new' || onb.exp === 'returning');
  store.onboarded = true;
  saveStore();
  closeSheet();
  navigate('home');
  setTimeout(()=> toast('Your plan: ' + PLANS[plan].name), 300);
}

/* ===== standalone rest timer ===== */
function openTimer(seconds = 60){
  state.timer.total = seconds; state.timer.remaining = seconds; state.timer.paused = false;
  document.getElementById('timerModal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  document.getElementById('timerToggle').textContent = 'Pause';
  document.getElementById('timerLabel').textContent = 'Breathe. Let your muscles recover.';
  updateTimerDisplay(); startTimerLoop();
}
function startTimerLoop(){
  clearInterval(state.timer.intervalId);
  state.timer.intervalId = setInterval(()=>{
    if (state.timer.paused) return;
    state.timer.remaining--;
    if (state.timer.remaining <= 0){
      state.timer.remaining = 0; updateTimerDisplay();
      clearInterval(state.timer.intervalId); beep();
      document.getElementById('timerLabel').textContent = "Time's up — next set.";
      document.getElementById('timerToggle').textContent = 'Restart';
      return;
    }
    updateTimerDisplay();
  }, 1000);
}
function updateTimerDisplay(){
  const d = document.getElementById('timerDisplay'), ring = document.getElementById('timerRing');
  if (!d || !ring) return;
  d.textContent = mmss(state.timer.remaining);
  ring.style.strokeDashoffset = -(1 - state.timer.remaining/state.timer.total) * 282.7;
}
function closeTimer(){
  clearInterval(state.timer.intervalId);
  document.getElementById('timerModal').classList.add('hidden');
  if (!sess.active) document.body.style.overflow = '';
  document.getElementById('timerLabel').textContent = 'Breathe. Let your muscles recover.';
  document.getElementById('timerToggle').textContent = 'Pause';
}
function beep(){
  try {
    if (store.sound){
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.05; o.start();
      setTimeout(()=>{ o.stop(); ctx.close(); }, 220);
    }
    if (store.vibrate && navigator.vibrate) navigator.vibrate([60,40,60]);
  } catch {}
}

/* ===== SETTINGS ===== */
function openSettings(){
  openSheet(`
    <h2 class="font-display font-black text-xl">Settings</h2>

    <div class="eyebrow mt-5 mb-2">Training</div>
    <div class="space-y-2">
      <button class="card p-4 w-full text-left" onclick="closeSheet(); navigate('plans');">
        <div class="font-bold text-sm">Plan: ${esc(getPlan().name)}</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">${getPlan().days} days a week · ${esc(getPlan().tag)}</p></button>
      <button class="card p-4 w-full text-left" onclick="closeSheet(); toggleBeginner(); navigate('home');">
        <div class="font-bold text-sm">Beginner mode: ${store.beginnerMode ? 'on' : 'off'}</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">${store.beginnerMode ? 'Hard lifts swapped for easier versions, 6 exercises per day.' : 'Full plan, including barbell squats, bench press and pull-ups.'}</p></button>
      <button class="card p-4 w-full text-left" onclick="closeSheet(); openEquipment();">
        <div class="font-bold text-sm">Your equipment</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">${store.equipment.length} of ${EQUIPMENT.length} available.</p></button>
      <button class="card p-4 w-full text-left" onclick="cycleRest()">
        <div class="font-bold text-sm">Rest length: ${({plan:'as planned',short:'30% shorter',long:'30% longer'})[store.restStyle]}</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">Tap to change. Shorter rests suit conditioning; longer rests suit heavy strength work.</p></button>
      <button class="card p-4 w-full text-left" onclick="store.autoRest=!store.autoRest;saveStore();openSettings();">
        <div class="font-bold text-sm">Start rest automatically: ${store.autoRest?'on':'off'}</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">The rest clock starts the moment you log a set.</p></button>
    </div>

    <div class="eyebrow mt-5 mb-2">Preferences</div>
    <div class="space-y-2">
      <button class="card p-4 w-full text-left" onclick="store.units = store.units==='kg'?'lb':'kg'; saveStore(); openSettings(); toast('Now using ' + store.units);">
        <div class="font-bold text-sm">Weight units: ${store.units}</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">Existing numbers are not converted — they keep the value you logged.</p></button>
      <button class="card p-4 w-full text-left" onclick="store.sound=!store.sound;saveStore();openSettings();">
        <div class="font-bold text-sm">Timer sound: ${store.sound?'on':'off'}</div></button>
      <button class="card p-4 w-full text-left" onclick="store.vibrate=!store.vibrate;saveStore();openSettings();">
        <div class="font-bold text-sm">Vibration: ${store.vibrate?'on':'off'}</div></button>
    </div>

    <div class="eyebrow mt-5 mb-2">Colour</div>
    <div class="flex flex-wrap gap-2">
      ${Object.entries(ACCENTS).map(([id,a])=>`
        <button onclick="setAccent('${id}')" class="chip ${store.accent===id?'active':''}">
          <span class="w-3 h-3 rounded-full" style="background:${a.accent};"></span>${a.label}</button>`).join('')}
    </div>

    <div class="eyebrow mt-5 mb-2">Data</div>
    <div class="space-y-2">
      <button class="card p-4 w-full text-left" onclick="closeSheet(); openDataSheet();">
        <div class="font-bold text-sm">Backup, restore or reset</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">Everything is stored on this device only.</p></button>
      <button class="card p-4 w-full text-left" onclick="testImages()">
        <div class="font-bold text-sm">Check exercise animations</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">Tests whether the GIFs can reach this device.</p></button>
      <button class="card p-4 w-full text-left" onclick="closeSheet(); startOnboarding();">
        <div class="font-bold text-sm">Run setup again</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">Re-answer the four questions and pick a fresh plan.</p></button>
    </div>

    <p class="text-[11px] text-[var(--text-mute)] mt-5 text-center">RYZE · general fitness information, not medical advice.</p>
    <button class="btn-ghost w-full py-3 mt-3 font-bold text-sm" data-close-sheet>Close</button>`);
}
function setAccent(id){ store.accent = id; saveStore(); applyAccent(); openSettings(); }
function cycleRest(){
  const order = ['plan','short','long'];
  store.restStyle = order[(order.indexOf(store.restStyle)+1) % 3];
  saveStore(); openSettings(); toast('Rest: ' + store.restStyle);
}

function testImages(){
  const probe = EXERCISES['push-up'].gif;
  document.getElementById('sheetBody').innerHTML =
    '<h2 class="font-display font-black text-xl">Checking animations…</h2>' +
    '<p class="text-sm text-[var(--text-dim)] mt-2">Loading a test GIF from the CDN.</p>';
  const img = new Image();
  const finish = (ok, where) => {
    document.getElementById('sheetBody').innerHTML = ok
      ? '<h2 class="font-display font-black text-xl">Animations are working</h2>' +
        '<p class="text-sm text-[var(--text-dim)] mt-2">Loaded successfully from ' + where + '. If a particular exercise still shows a diagram, that one file is missing and everything else is fine.</p>' +
        '<img src="' + img.src + '" alt="Test animation" style="width:100%;border-radius:14px;margin-top:14px;background:#fff;">' +
        '<button class="btn-accent w-full py-3.5 mt-4 font-bold" data-close-sheet>Close</button>'
      : '<h2 class="font-display font-black text-xl">Animations are blocked</h2>' +
        '<p class="text-sm text-[var(--text-dim)] mt-2">This device or preview cannot reach the GIF host, so diagrams are shown instead. Saving this file and opening it directly in your browser normally fixes it. Everything else works either way.</p>' +
        '<button class="btn-accent w-full py-3.5 mt-4 font-bold" data-close-sheet>Close</button>';
    document.querySelectorAll('#sheet [data-close-sheet]').forEach(b => b.addEventListener('click', closeSheet));
  };
  img.onload = () => finish(true, img.src.includes('jsdelivr') ? 'the jsDelivr CDN' : 'GitHub');
  img.onerror = () => {
    if (!img.dataset.retried){ img.dataset.retried = '1'; img.src = probe.replace(GIF, GIF_MIRROR); return; }
    finish(false);
  };
  img.src = probe;
}

/* ============================================================
   11. NAV + INIT
   ============================================================ */

function updateStreakBadge(){
  const el = document.getElementById('streakCount');
  if (el) el.textContent = store.streak;
  const tag = document.getElementById('planTag');
  if (tag) tag.textContent = getPlan().name;
}

const PAGES = ['home','workout','library','learn','progress','tools','plans','builder','history'];

function navigate(page){
  state.page = page;
  PAGES.forEach(p => document.getElementById('page-'+p).classList.toggle('hidden', p !== page));
  const active = document.getElementById('page-'+page);
  active.classList.remove('page'); void active.offsetWidth; active.classList.add('page');

  if (page === 'home') renderHome();
  if (page === 'workout') renderWorkout();
  if (page === 'library') renderLibrary();
  if (page === 'learn') renderLearn();
  if (page === 'progress') renderProgress();
  if (page === 'tools') renderTools();
  if (page === 'plans') renderPlans();
  if (page === 'builder') renderBuilder();

  document.querySelectorAll('.nav-btn').forEach(b => {
    const on = b.dataset.nav === page
      || (page === 'workout' && b.dataset.nav === 'home')
      || (page === 'plans' && b.dataset.nav === 'home')
      || (page === 'builder' && b.dataset.nav === 'home');
    b.style.color = on ? 'var(--accent)' : 'var(--text-dim)';
  });
  window.scrollTo({ top:0, behavior:'instant' });
  updateStreakBadge();
}

function bindGlobal(){
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', ()=> navigate(b.dataset.nav)));
  document.querySelectorAll('[data-close-modal]').forEach(b => b.addEventListener('click', closeExerciseModal));
  document.getElementById('sheet').querySelector('.modal-backdrop').addEventListener('click', closeSheet);
  document.getElementById('btnSettings').addEventListener('click', openSettings);
  document.getElementById('btnStreak').addEventListener('click', ()=> navigate('progress'));

  document.querySelectorAll('[data-timer-preset]').forEach(b => b.addEventListener('click', ()=>{
    const s = parseInt(b.dataset.timerPreset,10);
    state.timer.total = s; state.timer.remaining = s; state.timer.paused = false;
    document.getElementById('timerLabel').textContent = 'Breathe. Let your muscles recover.';
    document.getElementById('timerToggle').textContent = 'Pause';
    updateTimerDisplay(); startTimerLoop();
  }));
  document.getElementById('timerToggle').addEventListener('click', ()=>{
    if (state.timer.remaining === 0){
      state.timer.remaining = state.timer.total; state.timer.paused = false;
      document.getElementById('timerLabel').textContent = 'Breathe. Let your muscles recover.';
      document.getElementById('timerToggle').textContent = 'Pause';
      startTimerLoop(); return;
    }
    state.timer.paused = !state.timer.paused;
    document.getElementById('timerToggle').textContent = state.timer.paused ? 'Resume' : 'Pause';
  });
  document.getElementById('timerClose').addEventListener('click', closeTimer);

  document.addEventListener('click', e => {
    const t = e.target.closest('.jargon');
    if (t){ e.stopPropagation(); showDefinition(t.dataset.term); }
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!document.getElementById('sheet').classList.contains('hidden')) return closeSheet();
    if (!document.getElementById('exerciseModal').classList.contains('hidden')) return closeExerciseModal();
    if (!document.getElementById('timerModal').classList.contains('hidden')) return closeTimer();
  });

  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState === 'visible' && sess.active) requestWakeLock();
  });
}

function init(){
  applyAccent();
  bindGlobal();
  updateStreakBadge();
  navigate('home');
}
init();

</script>
