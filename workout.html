<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#08090E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>RYZE — Gym Trainer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-0: #08090E;
    --bg-1: #0E1018;
    --surface: rgba(255,255,255,0.04);
    --surface-2: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #F5F6F8;
    --text-dim: #A1A6B3;
    --text-mute: #6B7080;
    --accent: #D4FF4F;
    --accent-soft: rgba(212,255,79,0.16);
    --accent-glow: rgba(212,255,79,0.35);
    --coral: #FF6B4A;
    --cyan: #4ADEFF;
    --gold: #FFCB47;
    --easy: #4ADEFF;
    --med: #FFCB47;
    --hard: #FF6B4A;
  }

  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { overscroll-behavior-y: contain; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg-0);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
    background-image:
      radial-gradient(1200px 600px at 20% -10%, rgba(212,255,79,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(74,222,255,0.05), transparent 60%),
      linear-gradient(180deg, #08090E 0%, #06070C 100%);
    background-attachment: fixed;
  }

  .font-display { font-family: 'Archivo', sans-serif; letter-spacing: -0.02em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .glass {
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--border);
  }
  .glass-strong {
    background: rgba(16,18,26,0.86);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--border-strong);
  }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
    border: 1px solid var(--border);
    border-radius: 20px;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .2s;
  }
  .card:active { transform: scale(.985); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 13px; border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    transition: all .2s; white-space: nowrap;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #0a0a0a; box-shadow: 0 0 24px var(--accent-glow); }
  .chip:active { transform: scale(.95); }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 4px 8px; border-radius: 6px;
  }
  .badge-easy   { background: rgba(74,222,255,0.12); color: var(--easy); border:1px solid rgba(74,222,255,0.25); }
  .badge-med    { background: rgba(255,203,71,0.12); color: var(--med);  border:1px solid rgba(255,203,71,0.25); }
  .badge-hard   { background: rgba(255,107,74,0.12); color: var(--hard); border:1px solid rgba(255,107,74,0.25); }
  .badge-muscle { background: rgba(255,255,255,0.05); color: var(--text-dim); border:1px solid var(--border); }

  .btn-accent {
    background: var(--accent); color: #0a0a0a; font-weight: 700; border-radius: 14px;
    transition: transform .15s, box-shadow .2s; box-shadow: 0 8px 30px -8px var(--accent-glow);
  }
  .btn-accent:active { transform: scale(.97); }
  .btn-accent:disabled { opacity: .4; box-shadow: none; }

  .btn-ghost {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--text); border-radius: 14px; transition: all .2s;
  }
  .btn-ghost:active { transform: scale(.97); background: rgba(255,255,255,0.08); }

  .page { animation: pageIn .3s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 100%);
    background-size: 200% 100%; animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .live-dot { animation: livePulse 1.6s ease-in-out infinite; }

  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .breathe { animation: breathe 2.6s ease-in-out infinite; transform-origin: center; }

  @keyframes flicker { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.08) rotate(2deg); } }
  .flicker { animation: flicker 1.4s ease-in-out infinite; transform-origin: bottom center; }

  .scroll-x { display: flex; gap: 8px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }

  .ex-img-wrap {
    position: relative; overflow: hidden; border-radius: 16px;
    background: linear-gradient(135deg, rgba(212,255,79,0.04), rgba(74,222,255,0.04));
    border: 1px solid var(--border); aspect-ratio: 4/3;
  }
  .ex-img-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .ex-img-wrap svg.fallback { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ex-img-wrap .skeleton-layer { position: absolute; inset: 0; transition: opacity .3s; }

  .nav-pad { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }

  .modal-backdrop { background: rgba(2,3,7,0.72); backdrop-filter: blur(10px); }
  .modal-sheet { animation: sheetUp .32s cubic-bezier(.2,.7,.2,1) both; max-height: 92vh; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }

  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .pop { animation: pop .35s cubic-bezier(.2,.7,.2,1) both; }

  .exercise-done { opacity: 0.5; }
  .today-glow { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 14px 50px -14px var(--accent-glow); }

  button { user-select: none; }

  /* ---- Jargon term ---- */
  .jargon {
    color: var(--text); font: inherit; padding: 0;
    border-bottom: 1px dashed rgba(212,255,79,0.65);
    background: none; cursor: pointer;
  }
  .jargon:active { color: var(--accent); }

  /* ---- Guided session ---- */
  #session {
    position: fixed; inset: 0; z-index: 70;
    background: var(--bg-0);
    background-image:
      radial-gradient(900px 500px at 50% -10%, rgba(212,255,79,0.10), transparent 60%),
      linear-gradient(180deg, #0A0B11 0%, #06070C 100%);
    display: flex; flex-direction: column;
  }
  /* ID specificity beats Tailwind's .hidden class, so state it explicitly */
  #session.hidden { display: none; }
  .hidden { display: none !important; }
  #session .sess-body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 20px calc(20px + env(safe-area-inset-bottom));
  }
  #session .sess-foot {
    padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: rgba(10,11,17,0.9);
    backdrop-filter: blur(20px);
  }
  .seg-track { display: flex; gap: 3px; }
  .seg { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.10); transition: background .3s; }
  .seg.done { background: var(--accent); }
  .seg.now  { background: rgba(212,255,79,0.55); }

  .stepper {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 16px; padding: 6px;
  }
  .stepper button {
    width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    font-size: 22px; font-weight: 700; line-height: 1; color: var(--text);
  }
  .stepper button:active { background: var(--accent); color: #0a0a0a; }
  .stepper .val { text-align: center; flex: 1; min-width: 0; }

  .set-pip {
    flex: 1; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-mute);
  }
  .set-pip.done { background: var(--accent-soft); border-color: rgba(212,255,79,0.45); color: var(--accent); }
  .set-pip.now  { background: var(--accent); border-color: var(--accent); color: #0a0a0a; }

  .kv { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px dashed rgba(255,255,255,0.07); }
  .kv:last-child { border-bottom: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<body class="text-white">

<div id="app" class="relative z-10 max-w-[480px] mx-auto">

  <!-- TOP BAR -->
  <header class="sticky top-0 z-40 px-5 pt-4 pb-3 glass-strong" style="border-bottom:1px solid var(--border);">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center font-display font-black text-lg" style="background:var(--accent); color:#0a0a0a;">R</div>
        <div>
          <div class="font-display font-black text-[17px] leading-none tracking-tight">RYZE</div>
          <div class="text-[10px] text-[var(--text-mute)] font-mono uppercase tracking-widest mt-0.5">Train · Track · Rise</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnStreak" class="glass px-2.5 py-1.5 rounded-full flex items-center gap-1.5 text-xs font-bold">
          <span class="flicker">🔥</span><span id="streakCount">0</span>
        </button>
        <button id="btnSettings" class="glass w-9 h-9 rounded-full flex items-center justify-center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="px-5 nav-pad">
    <section id="page-home" class="page py-5"></section>
    <section id="page-workout" class="page py-5 hidden"></section>
    <section id="page-explorer" class="page py-5 hidden"></section>
    <section id="page-learn" class="page py-5 hidden"></section>
    <section id="page-progress" class="page py-5 hidden"></section>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-40 px-4" style="padding-bottom: calc(12px + env(safe-area-inset-bottom));">
    <div class="glass-strong rounded-2xl flex items-center justify-around py-2 px-1" style="box-shadow: 0 -10px 40px -10px rgba(0,0,0,0.6);">
      <button data-nav="home" class="nav-btn flex-1 py-2 rounded-xl flex flex-col items-center gap-0.5 text-[10px] font-bold uppercase tracking-wider">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
        Today
      </button>
      <button data-nav="explorer" class="nav-btn flex-1 py-2 rounded-xl flex flex-col items-center gap-0.5 text-[10px] font-bold uppercase tracking-wider">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Moves
      </button>
      <button data-nav="learn" class="nav-btn flex-1 py-2 rounded-xl flex flex-col items-center gap-0.5 text-[10px] font-bold uppercase tracking-wider">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M9 8h6"/></svg>
        Basics
      </button>
      <button data-nav="progress" class="nav-btn flex-1 py-2 rounded-xl flex flex-col items-center gap-0.5 text-[10px] font-bold uppercase tracking-wider">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>
        Progress
      </button>
    </div>
  </nav>

  <!-- EXERCISE DETAIL SHEET -->
  <div id="exerciseModal" class="fixed inset-0 z-[80] hidden flex items-end justify-center">
    <div class="modal-backdrop absolute inset-0" data-close-modal></div>
    <div class="modal-sheet relative w-full max-w-[480px] glass-strong rounded-t-3xl overflow-hidden" style="border-bottom:none;">
      <div class="absolute top-2.5 left-1/2 -translate-x-1/2 w-10 h-1 rounded-full bg-white/20 z-10"></div>
      <button class="absolute top-3 right-3 w-9 h-9 rounded-full glass flex items-center justify-center z-10" data-close-modal>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="exerciseModalBody" class="overflow-y-auto no-scrollbar" style="max-height:92vh;"></div>
    </div>
  </div>

  <!-- GENERIC SHEET (swap / settings / onboarding / glossary) -->
  <div id="sheet" class="fixed inset-0 z-[90] hidden flex items-end justify-center">
    <div class="modal-backdrop absolute inset-0" data-close-sheet></div>
    <div class="modal-sheet relative w-full max-w-[480px] glass-strong rounded-t-3xl overflow-hidden" style="border-bottom:none;">
      <div class="absolute top-2.5 left-1/2 -translate-x-1/2 w-10 h-1 rounded-full bg-white/20 z-10"></div>
      <div id="sheetBody" class="overflow-y-auto no-scrollbar p-5 pt-7" style="max-height:88vh;"></div>
    </div>
  </div>

  <!-- STANDALONE REST TIMER -->
  <div id="timerModal" class="fixed inset-0 z-[85] hidden flex items-center justify-center">
    <div class="modal-backdrop absolute inset-0"></div>
    <div class="relative w-[88%] max-w-[360px] glass-strong rounded-3xl p-6 text-center">
      <div class="text-[10px] font-mono uppercase tracking-[0.2em] text-[var(--text-mute)]">Rest timer</div>
      <div class="text-xs text-[var(--text-dim)] mt-1" id="timerLabel">Breathe. Let your muscles recover.</div>
      <div class="relative w-[190px] h-[190px] mx-auto my-5">
        <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">
          <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
          <circle id="timerRing" cx="50" cy="50" r="45" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0" style="transition: stroke-dashoffset .95s linear;"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <div id="timerDisplay" class="font-display font-black text-5xl tabular-nums">00:30</div>
          <div class="text-[10px] font-mono uppercase tracking-widest text-[var(--text-mute)] mt-1">remaining</div>
        </div>
      </div>
      <div class="grid grid-cols-4 gap-2 mb-4">
        <button class="btn-ghost py-2 text-xs font-bold" data-timer-preset="30">30s</button>
        <button class="btn-ghost py-2 text-xs font-bold" data-timer-preset="60">60s</button>
        <button class="btn-ghost py-2 text-xs font-bold" data-timer-preset="90">90s</button>
        <button class="btn-ghost py-2 text-xs font-bold" data-timer-preset="120">2m</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button id="timerToggle" class="btn-accent py-3 font-bold text-sm">Pause</button>
        <button id="timerClose" class="btn-ghost py-3 font-bold text-sm">Close</button>
      </div>
    </div>
  </div>

  <!-- GUIDED SESSION (hidden until started) -->
  <div id="session" class="hidden"></div>

  <!-- TOAST -->
  <div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[100] hidden" style="bottom: calc(96px + env(safe-area-inset-bottom));">
    <div class="glass-strong rounded-full px-4 py-2.5 text-sm font-semibold whitespace-nowrap" id="toastText"></div>
  </div>

</div>

<script>
/* ============================================================
   RYZE — beginner-first gym trainer
   1 DATA (glossary, exercises, program)
   2 STORAGE + STATE
   3 IMAGES
   4 HELPERS
   5 PAGES
   6 GUIDED SESSION  <- the main change
   7 SHEETS / TIMER
   8 NAV + INIT
   ============================================================ */

/* ============================================================
   1. DATA
   ============================================================ */

/* Plain-English definitions. Any of these words appearing in
   instructions becomes tappable. */
const DEFS = {
  rep: { t: 'Rep (repetition)', d: 'One complete movement. Lower the weight and push it back up once = 1 rep.' },
  set: { t: 'Set', d: 'A group of reps done back-to-back without stopping. "3 sets of 10" means do 10 reps, rest, and repeat that twice more.' },
  rest: { t: 'Rest', d: 'The break between sets. Sitting still doing nothing is correct — it lets your muscles refill their energy so the next set is strong.' },
  'rep range': { t: 'Rep range', d: 'A target like 8–12. Pick a weight where you can hit at least the bottom number with good form. Once you can hit the top number on every set, add a little weight next time.' },
  'progressive overload': { t: 'Progressive overload', d: 'The whole point of lifting: do slightly more over time — more weight, more reps, or better control. Without it, your body has no reason to change.' },
  form: { t: 'Form', d: 'How you perform the movement. Good form = the right muscle works and your joints stay safe. Always beats lifting heavy.' },
  'good form': { t: 'Good form', d: 'Controlled movement, full range, no jerking or bouncing. If your form breaks, the set is over — that rep does not count.' },
  hinge: { t: 'Hip hinge', d: 'Pushing your hips backwards (like closing a car door with your bum) while your back stays flat. Your knees bend only a little. This is not a squat.' },
  squat: { t: 'Squat', d: 'Sitting down and standing up against resistance. Hips and knees both bend a lot.' },
  brace: { t: 'Brace', d: 'Tighten your stomach like someone is about to poke you. It protects your lower back.' },
  eccentric: { t: 'Eccentric (the lowering part)', d: 'The half of the rep where the weight goes down. Take 2–3 seconds here — it builds a lot of muscle and most beginners rush it.' },
  lockout: { t: 'Lockout', d: 'The end of the rep where your arms or legs are straight. "Don\'t lock out hard" means straighten without slamming the joint.' },
  supinate: { t: 'Supinate', d: 'Rotate your palm so it faces up towards the ceiling.' },
  'neutral spine': { t: 'Neutral spine', d: 'Your back keeps its natural slight curve — not rounded like a prawn, not arched like a banana.' },
  lats: { t: 'Lats', d: 'The big fan-shaped back muscles under your armpits. They pull your elbows down and back.' },
  'rear delts': { t: 'Rear delts', d: 'The back of your shoulder. Small, often ignored, and great for posture.' },
  quads: { t: 'Quads', d: 'The muscles on the front of your thigh. They straighten your knee.' },
  hamstrings: { t: 'Hamstrings', d: 'The muscles on the back of your thigh. They bend your knee and help you hinge.' },
  glutes: { t: 'Glutes', d: 'Your bum muscles. The strongest muscle group you own.' },
  core: { t: 'Core', d: 'Everything around your middle — abs, sides and lower back — working together to stop your torso wobbling.' },
  parallel: { t: 'Parallel', d: 'Level with the floor. "Squat to parallel" = go down until the crease of your hip is level with your knee.' },
  'range of motion': { t: 'Range of motion', d: 'How far the weight travels. Full range beats half reps almost every time.' },
  failure: { t: 'Failure', d: 'The point where you physically cannot do another rep. As a beginner, stop 1–2 reps before this.' },
  DOMS: { t: 'DOMS (muscle soreness)', d: 'Delayed onset muscle soreness — the ache that shows up 1–2 days after training. Normal, especially early on. It is not a measure of a good workout.' },
  spotter: { t: 'Spotter', d: 'Someone who stands over you ready to help lift the bar if you get stuck. Ask any staff member — it is completely normal.' },

  { icon:'🔢', t:'Sets, reps and rest', d:`A <b>rep</b> is one full movement. A <b>set</b> is a batch of reps done without stopping. "3 × 10" means three sets of ten reps.

• Could have done 5+ more → go up meaningfully next set.
• Could have done 3–4 more → go up a little.
• Could have done 1–2 more → that is your working weight.
• Could not finish the reps → go lighter, no ego.

<b>Progressive overload</b> means doing slightly more over time. In practice: hit the top of your rep range on every set, then add the smallest available increase next time — usually 2.5kg on a barbell, or one notch on a machine.

  { icon:'🔥', t:'Warming up (do not skip this)', d:`Two parts, five to ten minutes total:

1. Get warm. Five minutes on a bike, rower or treadmill until your breathing changes slightly.

2. Warm up the actual lift. Before your working sets, do 1–3 sets of the same exercise with much lighter weight. For example, before benching 40kg: 10 reps with the empty bar, then 5 reps at 30kg, then start.

These light sets do not count as working sets and are not logged.` },
  { icon:'😣', t:'Soreness, and when to worry', d:`Aching muscles a day or two after training is <b>DOMS</b>. It is normal, especially in your first few weeks, and it fades as your body adapts. It is not a scorecard — a session without soreness can still be excellent.

Train anyway if you are just sore. Move gently and it usually improves.

Stop and get it checked if you feel sharp pain during a movement, pain in a joint rather than a muscle, anything that gets worse as you continue, or pain that lingers past a week.` },
  { icon:'🫁', t:'Breathing', d:`Simple rule: breathe in as the weight comes down, breathe out as you push or pull it.

Never hold your breath through an entire heavy set — it spikes your blood pressure and can make you light-headed.

For heavy squats and deadlifts, take a breath at the top, hold it briefly as you brace your stomach, then breathe out at the end of the rep.` },
  { icon:'🛟', t:'Staying safe on your own', d:`Bench press: use a rack with the safety bars set just below your chest, or ask a member of staff for a <b>spotter</b>. Asking is completely normal and nobody minds.

Squats: set the safety bars to just below your lowest position. Then a failed rep just means you set the bar down.

As a beginner, stop 1–2 reps before you cannot do another. You get almost all the benefit and almost none of the risk.

Clip the collars on. Put your weights back.` },
  { icon:'🤷', t:'What if I cannot do an exercise?', d:`This is normal and it is not a problem. Every exercise in this app has an easier version.

During a session, tap <b>Swap</b> on any exercise to see an easier or harder alternative, or to skip it entirely.

Machine occupied? Do a later exercise first and come back. The order is a suggestion, not a rule.

Cannot do a single pull-up? Almost nobody can at first. Use the lat pulldown — it trains exactly the same muscles.` },
  { icon:'📅', t:'How to use this plan', d:`Five training days, one easy day, one full rest day. Do not train all seven.

Missed a day? Just do today's session. Do not try to catch up by doubling.

Only free three days a week? Do Push, Pull and Legs. Those three cover everything that matters.

Consistency over months beats intensity for a fortnight. The best plan is the one you actually turn up for.` },
];

function mountImage(container, ex){
  if (!container || !ex) return;
  container.classList.add('ex-img-wrap');

  const showFallback = () => {
    container.innerHTML = muscleSVG(ex.muscle, ex.name);
    if (!imageWarningShown){
      imageWarningShown = true;
      setTimeout(()=> toast('Animations unavailable — showing diagrams'), 600);
    }
  };
  if (isKnownBroken(ex.gif)) return showFallback();

  // The <img> goes straight into the document. A detached image created with
  // new Image() can be deferred indefinitely by lazy-loading heuristics, which
  // is why nothing ever appeared.
  container.innerHTML =
    '<div class="skeleton skeleton-layer"></div>' +
    '<img alt="' + esc(ex.name) + '" decoding="async" referrerpolicy="no-referrer" ' +
    'style="opacity:0;transition:opacity .3s;" src="' + ex.gif + '">';

  const skel = container.querySelector('.skeleton-layer');
  const img  = container.querySelector('img');
  if (!img) return showFallback();

  img.addEventListener('load', ()=>{
    imageCache.set(ex.gif, 'ok');
    img.style.opacity = '1';
    if (skel){ skel.style.opacity = '0'; setTimeout(()=> skel.remove(), 320); }
  });

  img.addEventListener('error', ()=>{
    // Second chance from the mirror before giving up on this URL.
    if (!img.dataset.retried && ex.gif.startsWith(GIF)){
      img.dataset.retried = '1';
      img.src = ex.gif.replace(GIF, GIF_MIRROR);
      return;
    }
    imageCache.set(ex.gif, 'fail');
    showFallback();
  });

  // Cached images can finish before the listener attaches.
  if (img.complete && img.naturalWidth > 0) img.dispatchEvent(new Event('load'));
}

   4. HELPERS
   ============================================================ */

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* Turn the first occurrence of each gym term into a tappable definition. */
const TERM_KEYS = Object.keys(TERMS).sort((a,b)=> b.length - a.length);
function jargon(text){
  let out = esc(text);
  const found = [];
  TERM_KEYS.forEach(word => {
    const re = new RegExp('\\b(' + word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')\\b', 'i');
    out = out.replace(re, (m, g1) => { found.push([TERMS[word], g1]); return '\u0001' + (found.length-1) + '\u0002'; });
  });
  return out.replace(/\u0001(\d+)\u0002/g, (_,i) => {
    const [key, shown] = found[i];
    return `<button class="jargon" data-term="${key}">${shown}</button>`;
  });
}

function difficultyBadge(d){
  const map = { beginner:['badge-easy','Easy'], intermediate:['badge-med','Medium'], advanced:['badge-hard','Hard'] };
  const [cls,label] = map[d] || map.beginner;
  return `<span class="badge ${cls}">${label}</span>`;
}
const muscleColor = m => (MUSCLE_GROUPS.find(x=>x.id===m) || {color:'#D4FF4F'}).color;
const muscleBadge = m => `<span class="badge badge-muscle" style="color:${muscleColor(m)};border-color:${muscleColor(m)}33;">${m}</span>`;

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.add('hidden'), 2200);
}

const isTimed = reps => /^\d+\s*s$/i.test(String(reps).trim()) || /^\d+\s*sec/i.test(String(reps).trim());
const timedSeconds = reps => parseInt(String(reps), 10) || 30;
const isBodyweight = ex => ex.equipment === 'bodyweight';

/* Target reps midpoint, for pre-filling the logger */
function targetReps(reps){
  const nums = String(reps).match(/\d+/g);
  if (!nums) return 10;
  if (nums.length >= 2) return Math.round((+nums[0] + +nums[1]) / 2);
  return +nums[0];
}

/* Build the exercise list for a day, applying Beginner mode */
function planFor(dayKey){
  const w = PROGRAM[dayKey];
  if (!w) return [];
  let list = w.exercises.map(e => ({ ...e }));
  if (store.beginnerMode) {
    list = list.map(e => {
      const swap = BEGINNER_SWAP[e.id];
      return swap ? { ...e, id: swap, sets: Math.max(2, e.sets - 1), swapped: true } : { ...e, sets: Math.max(2, e.sets - 1) };
    });
    const seen = new Set();
    list = list.filter(e => (seen.has(e.id) ? false : (seen.add(e.id), true))).slice(0, 6);
  }
  return list;
}

function todayLog(){
  const l = store.logs[todayKey()];
  return (l && l.dayKey === state.selectedDay) ? l : null;
}
function logFor(dayKey){
  const l = store.logs[todayKey()];
  return (l && l.dayKey === dayKey) ? l : null;
}
function setsDone(dayKey, exId){
  const l = logFor(dayKey);
  return (l && l.ex[exId]) ? l.ex[exId].length : 0;
}

function lastPerformance(exId){
  const dates = Object.keys(store.logs).sort().reverse();
  for (const d of dates) {
    if (d === todayKey()) continue;
    const rec = store.logs[d].ex[exId];
    if (rec && rec.length) return { date: d, sets: rec };
  }
  return null;
}

/* ============================================================
   6. GUIDED SESSION — one set at a time
   ============================================================ */

const sess = {
  active:false, dayKey:null, steps:[], i:0,
  resting:false, restLeft:0, restId:null,
  setLeft:0, setId:null, setRunning:false,
};

function buildSteps(dayKey){
  const plan = planFor(dayKey);
  const steps = [{ type:'warmup' }];
  plan.forEach(e => {
    for (let s = 1; s <= e.sets; s++){
      steps.push({ type:'set', exId:e.id, setNo:s, sets:e.sets, reps:e.reps, rest:e.rest });
    }
  });
  steps.push({ type:'finish' });
  return steps;
}

function startSession(dayKey){
  sess.dayKey = dayKey;
  sess.steps = buildSteps(dayKey);
  sess.active = true;
  sess.resting = false;

  // Resume: jump past sets already logged today
  const log = logFor(dayKey);
  if (log) {
    const counted = {};
    let resumeAt = 1;
    for (let i = 1; i < sess.steps.length; i++){
      const st = sess.steps[i];
      if (st.type !== 'set') break;
      counted[st.exId] = (counted[st.exId] || 0) + 1;
      const have = (log.ex[st.exId] || []).length;
      if (counted[st.exId] <= have) resumeAt = i + 1; else break;
    }
    sess.i = resumeAt;
  } else {
    sess.i = 0;
  }

  state.selectedDay = dayKey;
  document.getElementById('session').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  renderSession();
}

function exitSession(){
  stopRest(); stopSetTimer();
  sess.active = false;
  document.getElementById('session').classList.add('hidden');
  document.body.style.overflow = '';
  navigate(state.page === 'workout' ? 'workout' : 'home');
}

function confirmExit(){
  const doneNow = totalLoggedToday();
  if (doneNow === 0) return exitSession();
  openSheet(`
    <h2 class="font-display font-black text-xl">Leave this workout?</h2>
    <p class="text-sm text-[var(--text-dim)] mt-2">Your ${doneNow} logged ${doneNow===1?'set is':'sets are'} saved. You can pick up exactly where you left off later today.</p>
    <div class="grid grid-cols-2 gap-2 mt-5">
      <button class="btn-ghost py-3 font-bold text-sm" data-close-sheet>Carry on training</button>
      <button class="btn-accent py-3 font-bold text-sm" onclick="closeSheet(); exitSession();">Leave</button>
    </div>`);
}

function totalLoggedToday(){
  const l = logFor(sess.dayKey);
  return l ? Object.values(l.ex).reduce((a,b)=>a+b.length,0) : 0;
}

function sessionProgress(){
  const setSteps = sess.steps.filter(s => s.type === 'set');
  let doneCount = sess.steps.slice(0, sess.i).filter(s => s.type === 'set').length;
  if (sess.resting) doneCount += 1;
  return { total:setSteps.length, done:Math.min(doneCount, setSteps.length) };
}

function sessHeader(title, sub){
  const p = sessionProgress();
  return `
  <div class="px-5 pt-4 pb-3" style="padding-top:calc(14px + env(safe-area-inset-top));">

  </div>`;
}

function renderSession(){
  const root = document.getElementById('session');
  const step = sess.steps[sess.i];
  if (!step) return exitSession();
  if (sess.resting) return renderRest();
  if (step.type === 'warmup') return renderWarmupStep(root);
  if (step.type === 'finish') return renderFinishStep(root);
  return renderSetStep(root, step);
}

function renderSetStep(root, step){
  const ex = EXERCISES[step.exId];
  const last = lastPerformance(step.exId);
  const loggedSets = (logFor(sess.dayKey)?.ex[step.exId]) || [];
  const bodyweight = isBodyweight(ex);
  const timed = isTimed(step.reps);

  // sensible default weight: last set today > last session > blank
  let defW = '';
  if (loggedSets.length) defW = loggedSets[loggedSets.length-1].w;
  else if (last) defW = last.sets[last.sets.length-1].w;
  const defR = timed ? timedSeconds(step.reps) : targetReps(step.reps);

  const upNext = sess.steps[sess.i+1];
  const upNextLabel = upNext && upNext.type==='set'
    ? (upNext.exId === step.exId ? `Set ${upNext.setNo} of the same exercise` : EXERCISES[upNext.exId].name)
    : 'Finish';

  root.innerHTML = `
    ${sessHeader(ex.name, `Set ${step.setNo} of ${step.sets}`)}
    <div class="sess-body">
      <div id="sessImg" class="ex-img-wrap mb-4" style="aspect-ratio:16/11;"></div>

      <div class="flex items-center gap-2 mb-2">
        ${muscleBadge(ex.muscle)} ${difficultyBadge(ex.difficulty)}
        <span class="badge badge-muscle">${ex.equipment}</span>

      <h1 class="font-display font-black text-[24px] leading-tight">${ex.name}</h1>
      <p class="text-sm text-[var(--text-dim)] mt-1.5">${esc(ex.plain)}</p>
      <p class="text-sm mt-2" style="color:var(--accent);">Feel it: ${esc(ex.feel)}</p>

      <div class="flex gap-1.5 mt-4">
        ${Array.from({length: step.sets}, (_,k)=>{
          const n = k+1;
          const cls = n < step.setNo ? 'done' : (n === step.setNo ? 'now' : '');
          return `<div class="set-pip ${cls}">SET ${n}</div>`;
        }).join('')}
      </div>

        </div>

          ${bodyweight ? '' : `

            <div class="text-[10px] font-mono uppercase tracking-widest text-[var(--text-mute)] mb-1.5">Weight (${store.units})</div>
            <div class="stepper">
              <button onclick="bump('w',-2.5)">−</button>

          <div>

            <div class="stepper">
              <button onclick="bump('r',-1)">−</button>
              <div class="val"><input id="inR" inputmode="numeric" value="${defR}" class="w-full bg-transparent text-center font-display font-black text-3xl outline-none"/></div>
              <button onclick="bump('r',1)">+</button>

        <button onclick="openSwapSheet('${step.exId}')" class="btn-ghost py-3 text-xs font-bold">Swap</button>
        <button onclick="skipExercise('${step.exId}')" class="btn-ghost py-3 text-xs font-bold">Skip</button>
      </div>

      <div class="card p-3.5 mt-3">
        <div class="text-[10px] font-mono uppercase tracking-widest text-[var(--text-mute)] mb-1.5">Remember</div>
        <ul class="space-y-1.5">
          ${ex.cues.slice(0,3).map(c=>`<li class="flex gap-2 text-sm text-[var(--text-dim)]"><span style="color:var(--gold);">›</span><span>${jargon(c)}</span></li>`).join('')}
        </ul>
      </div>

      ${ex.safety ? `<div class="card p-3.5 mt-3" style="border-color:rgba(255,107,74,0.35);background:rgba(255,107,74,0.06);">
        <div class="flex gap-2"><span>⚠️</span><div><div class="font-bold text-sm" style="color:var(--coral);">Safety</div>
        <p class="text-sm text-[var(--text-dim)] mt-1">${jargon(ex.safety)}</p></div></div></div>` : ''}

      <div class="text-center text-[11px] text-[var(--text-mute)] mt-4">Up next: ${esc(upNextLabel)}</div>
      <div class="h-4"></div>
    </div>
    <div class="sess-foot">
      <button onclick="logSet()" class="btn-accent w-full py-4 font-bold text-[15px]">Set done — start rest</button>
    </div>`;

    const btn = document.getElementById('setTimerBtn');
    sess.setLeft = defR; sess.setRunning = false;
    btn.addEventListener('click', ()=> toggleSetTimer(defR));
  }
}

function bump(which, delta){
  const input = document.getElementById(which === 'w' ? 'inW' : 'inR');
  if (!input) return;
  let v = parseFloat(input.value);
  if (isNaN(v)) v = which === 'w' ? 0 : 0;
  v = Math.max(0, Math.round((v + delta) * 100) / 100);
  input.value = v;
}

function toggleSetTimer(total){
  const btn = document.getElementById('setTimerBtn');
  const disp = document.getElementById('setTimerDisplay');
  if (sess.setRunning){ stopSetTimer(); btn.textContent = 'Resume'; return; }
  sess.setRunning = true;
  btn.textContent = 'Pause';
  sess.setId = setInterval(()=>{
    sess.setLeft--;
    if (disp) disp.textContent = `${String(Math.floor(Math.max(0,sess.setLeft)/60)).padStart(2,'0')}:${String(Math.max(0,sess.setLeft)%60).padStart(2,'0')}`;
    if (sess.setLeft <= 0){ stopSetTimer(); beep(); logSet(); }
  }, 1000);
}
function stopSetTimer(){ clearInterval(sess.setId); sess.setRunning = false; }

function logSet(){
  const step = sess.steps[sess.i];
  if (!step || step.type !== 'set') return;
  const ex = EXERCISES[step.exId];
  const wEl = document.getElementById('inW');
  const rEl = document.getElementById('inR');
  const w = wEl ? (parseFloat(wEl.value) || 0) : 0;
  const r = rEl ? (parseInt(rEl.value,10) || 0) : (isTimed(step.reps) ? timedSeconds(step.reps) : targetReps(step.reps));

  const key = todayKey();
  if (!store.logs[key] || store.logs[key].dayKey !== sess.dayKey) store.logs[key] = { dayKey: sess.dayKey, ex: {} };
  const log = store.logs[key];
  if (!log.ex[step.exId]) log.ex[step.exId] = [];
  log.ex[step.exId].push({ w, r });

  const b = store.best[step.exId];
  if (!b || w > b.w || (w === b.w && r > b.r)) store.best[step.exId] = { w, r, date: key };
  store.totalSets += 1;
  saveStore();
  stopSetTimer();

  const next = sess.steps[sess.i + 1];
  if (next && next.type === 'set'){
    startRest(step.rest);
  } else {
    sess.i += 1;
    renderSession();
  }
}

function startRest(seconds){
  sess.resting = true;
  sess.restLeft = seconds;
  renderRest();
  clearInterval(sess.restId);
  sess.restId = setInterval(()=>{
    sess.restLeft--;
    const d = document.getElementById('restDisplay');
    if (d) d.textContent = `${String(Math.floor(Math.max(0,sess.restLeft)/60)).padStart(2,'0')}:${String(Math.max(0,sess.restLeft)%60).padStart(2,'0')}`;
    const ring = document.getElementById('restRing');
    if (ring && sess.restTotal) ring.style.strokeDashoffset = -(1 - sess.restLeft/sess.restTotal) * 282.7;
    if (sess.restLeft <= 0){ stopRest(); beep(); endRest(); }
  }, 1000);
  sess.restTotal = seconds;
}
function stopRest(){ clearInterval(sess.restId); }
function endRest(){ stopRest(); sess.resting = false; sess.i += 1; renderSession(); }

function addRest(s){ sess.restLeft += s; sess.restTotal += s; const d = document.getElementById('restDisplay'); if (d) d.textContent = `${String(Math.floor(sess.restLeft/60)).padStart(2,'0')}:${String(sess.restLeft%60).padStart(2,'0')}`; }

function undoLastSet(){
  const step = sess.steps[sess.i];
  const log = logFor(sess.dayKey);
  if (log && log.ex[step.exId] && log.ex[step.exId].length){
    log.ex[step.exId].pop();
    store.totalSets = Math.max(0, store.totalSets - 1);
    saveStore();
  }
  stopRest(); sess.resting = false;
  renderSession();
  toast('Set removed — log it again');
}

function renderRest(){
  const root = document.getElementById('session');
  const next = sess.steps[sess.i + 1];
  const cur = sess.steps[sess.i];
  const nextEx = next && next.type === 'set' ? EXERCISES[next.exId] : null;
  const sameEx = next && next.type === 'set' && next.exId === cur.exId;
  const mm = String(Math.floor(Math.max(0,sess.restLeft)/60)).padStart(2,'0');
  const ss = String(Math.max(0,sess.restLeft)%60).padStart(2,'0');

  root.innerHTML = `
    ${sessHeader('Resting', 'Sit down, breathe')}
    <div class="sess-body flex flex-col items-center justify-center text-center" style="padding-top:8px;">
      <div class="relative w-[230px] h-[230px] my-2">
        <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">
          <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/>
          <circle id="restRing" cx="50" cy="50" r="45" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0" style="transition:stroke-dashoffset .95s linear;"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <div id="restDisplay" class="font-display font-black text-[52px] tabular-nums leading-none">${mm}:${ss}</div>
          <div class="text-[10px] font-mono uppercase tracking-widest text-[var(--text-mute)] mt-2">until your next set</div>
        </div>
      </div>

      <p class="text-sm text-[var(--text-dim)] max-w-[300px] mb-4">Doing nothing right now is correct. Resting properly is what makes your next set worth doing.</p>

      <div class="grid grid-cols-2 gap-2 w-full mb-4">
        <button onclick="addRest(30)" class="btn-ghost py-3 text-sm font-bold">+30 seconds</button>
        <button onclick="undoLastSet()" class="btn-ghost py-3 text-sm font-bold">Undo that set</button>
      </div>

      ${nextEx ? `<div class="card p-4 w-full text-left">
        <div class="text-[10px] font-mono uppercase tracking-widest text-[var(--text-mute)] mb-2">Coming up</div>
        <div class="flex gap-3 items-center">
          <div id="restNextImg" class="ex-img-wrap" style="width:64px;flex-shrink:0;aspect-ratio:1/1;"></div>
          <div class="min-w-0">
            <h3 class="font-bold text-sm">${sameEx ? 'Same exercise, set ' + next.setNo : nextEx.name}</h3>
            <p class="text-xs text-[var(--text-dim)] mt-0.5">${sameEx ? esc(nextEx.name) + ' — aim for ' + next.reps : esc(nextEx.plain)}</p>
          </div>
        </div>
      </div>` : ''}
      <div class="h-4"></div>
    </div>
    <div class="sess-foot">
      <button onclick="endRest()" class="btn-accent w-full py-4 font-bold text-[15px]">Skip rest, I'm ready</button>
    </div>`;

  if (nextEx) mountImage(document.getElementById('restNextImg'), nextEx);
}

function renderFinishStep(root){
  const log = logFor(sess.dayKey) || { ex:{} };
  const done = Object.entries(log.ex);
  const setCount = done.reduce((a,[,v])=>a+v.length,0);

  // Bank the workout once
  const key = todayKey();
  if (store.lastWorkoutDate !== key && setCount > 0){
    store.totalWorkouts += 1;
    const y = new Date(); y.setDate(y.getDate()-1);
    const ykey = y.toISOString().slice(0,10);
    store.streak = (store.lastWorkoutDate === ykey) ? store.streak + 1 : 1;
    store.lastWorkoutDate = key;
    saveStore();
    updateStreakBadge();
  }

  root.innerHTML = `
    ${sessHeader(DAY_LONG[sess.dayKey], 'Finished')}
    <div class="sess-body">
      <div class="text-center mt-4 mb-5">
        <div class="text-5xl mb-3 pop">🏆</div>
        <h1 class="font-display font-black text-[28px] leading-tight">That's the session done</h1>
        <p class="text-sm text-[var(--text-dim)] mt-2">${setCount} sets logged. Write nothing down — it is all saved.</p>
      </div>

      <div class="card p-4 mb-4">
        <div class="text-[10px] font-mono uppercase tracking-widest text-[var(--text-mute)] mb-2">What you did</div>
        ${done.length ? done.map(([id,sets])=>`
          <div class="kv"><span class="text-sm min-w-0 truncate pr-2">${EXERCISES[id] ? EXERCISES[id].name : id}</span>
          <span class="font-mono text-xs text-[var(--text-dim)] flex-shrink-0">${sets.map(s=>(s.w?s.w+store.units:'bw')+'×'+s.r).join(' · ')}</span></div>
        `).join('') : '<p class="text-sm text-[var(--text-dim)]">No sets logged this time.</p>'}
      </div>

      <div class="card p-4 mb-4">
        <div class="flex items-center gap-2 mb-1.5"><span>📈</span><h3 class="font-bold text-sm">Next time</h3></div>
        <p class="text-sm text-[var(--text-dim)] leading-relaxed">${jargon('Any exercise where you hit the top of the rep range on every set is ready for more weight — add the smallest jump available, usually 2.5kg. Everything else stays the same until it is. That is progressive overload, and it is the entire game.')}</p>
      </div>

      <div class="card p-4">
        <div class="flex items-center gap-2 mb-1.5"><span>🍽️</span><h3 class="font-bold text-sm">Now recover</h3></div>
        <p class="text-sm text-[var(--text-dim)] leading-relaxed">Eat a proper meal with protein in it within a few hours, drink water, and sleep. Soreness in a day or two is normal and nothing to worry about.</p>
      </div>
      <div class="h-4"></div>
    </div>
    <div class="sess-foot">
      <button onclick="exitSession()" class="btn-accent w-full py-4 font-bold text-[15px]">Done</button>
    </div>`;
}

function nextStep(){ sess.i += 1; renderSession(); }

function skipExercise(exId){
  openSheet(`
    <h2 class="font-display font-black text-xl">Skip ${esc(EXERCISES[exId].name)}?</h2>
    <p class="text-sm text-[var(--text-dim)] mt-2">Machine busy, or something hurts? Skipping one exercise is completely fine — the session still counts.</p>
    <div class="grid grid-cols-2 gap-2 mt-5">
      <button class="btn-ghost py-3 font-bold text-sm" data-close-sheet>Keep it</button>
      <button class="btn-accent py-3 font-bold text-sm" onclick="doSkip('${exId}')">Skip it</button>
    </div>`);
}
function doSkip(exId){
  closeSheet();
  sess.steps = sess.steps.filter((s,idx)=> idx < sess.i || !(s.type==='set' && s.exId===exId));
  sess.resting = false; stopRest();
  if (sess.i >= sess.steps.length) sess.i = sess.steps.length - 1;
  renderSession();
  toast('Skipped');
}

function openSwapSheet(exId){
  const ex = EXERCISES[exId];
  const easier = ex.easier;
  const harder = ex.harder;
  const easierEx = (easier && EXERCISES[easier]) ? EXERCISES[easier] : null;
  const harderEx = (harder && EXERCISES[harder]) ? EXERCISES[harder] : null;

  openSheet(`
    <h2 class="font-display font-black text-xl">Change this exercise</h2>
    <p class="text-sm text-[var(--text-dim)] mt-1.5">Swapping is not cheating. The right exercise is the hardest one you can do with good form.</p>

    <div class="mt-4 space-y-2.5">
      ${easierEx ? `<button class="card p-4 w-full text-left" onclick="doSwap('${exId}','${ex.easier}')">
        <div class="text-[10px] font-mono uppercase tracking-widest" style="color:var(--easy);">Easier</div>
        <div class="font-bold text-sm mt-1">${easierEx.name}</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">${esc(easierEx.plain)}</p>
      </button>` : (easier ? `<div class="card p-4">
        <div class="text-[10px] font-mono uppercase tracking-widest" style="color:var(--easy);">Make it easier</div>
        <p class="text-sm text-[var(--text-dim)] mt-1.5">${esc(easier)}</p></div>` : '')}

      ${harderEx ? `<button class="card p-4 w-full text-left" onclick="doSwap('${exId}','${ex.harder}')">
        <div class="text-[10px] font-mono uppercase tracking-widest" style="color:var(--hard);">Harder</div>
        <div class="font-bold text-sm mt-1">${harderEx.name}</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">${esc(harderEx.plain)}</p>
      </button>` : (harder ? `<div class="card p-4">
        <div class="text-[10px] font-mono uppercase tracking-widest" style="color:var(--hard);">Make it harder</div>
        <p class="text-sm text-[var(--text-dim)] mt-1.5">${esc(harder)}</p></div>` : '')}

      <div class="card p-4">
        <div class="text-[10px] font-mono uppercase tracking-widest text-[var(--text-mute)]">Same muscle, different move</div>
        <div class="flex flex-wrap gap-2 mt-2.5">
          ${Object.entries(EXERCISES).filter(([id,e])=> e.muscle===ex.muscle && id!==exId).slice(0,6)
            .map(([id,e])=>`<button class="chip" onclick="doSwap('${exId}','${id}')">${e.name}</button>`).join('')}
        </div>
      </div>
    </div>
    <button class="btn-ghost w-full py-3 mt-4 font-bold text-sm" data-close-sheet>Cancel</button>
  `);
}
function doSwap(oldId, newId){
  closeSheet();
  if (!EXERCISES[newId]) return;
  for (let i = sess.i; i < sess.steps.length; i++){
    if (sess.steps[i].type === 'set' && sess.steps[i].exId === oldId) sess.steps[i].exId = newId;
  }
  renderSession();
  toast('Swapped to ' + EXERCISES[newId].name);
}

function openSheet(html){

function closeSheet(){
  document.getElementById('sheet').classList.add('hidden');
  if (!sess.active) document.body.style.overflow = '';
}

function showDefinition(key){
  const d = DEFS[key];
  if (!d) return;
  openSheet(`
    <div class="text-[10px] font-mono uppercase tracking-widest text-[var(--text-mute)]">In plain English</div>
    <h2 class="font-display font-black text-2xl mt-1">${d.t}</h2>
    <p class="text-[15px] text-[var(--text-dim)] mt-3 leading-relaxed">${d.d}</p>
    <button class="btn-accent w-full py-3.5 mt-6 font-bold" data-close-sheet>Got it</button>`);
}

/* ===== standalone rest timer ===== */
function openTimer(seconds = 60){
  state.timer.total = seconds; state.timer.remaining = seconds; state.timer.paused = false;
  document.getElementById('timerModal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  document.getElementById('timerToggle').textContent = 'Pause';
  updateTimerDisplay(); startTimerLoop();
}
function startTimerLoop(){
  clearInterval(state.timer.intervalId);
  state.timer.intervalId = setInterval(()=>{
    if (state.timer.paused) return;
    state.timer.remaining--;
    if (state.timer.remaining <= 0){
      state.timer.remaining = 0; updateTimerDisplay();
      clearInterval(state.timer.intervalId); beep();
      document.getElementById('timerLabel').textContent = "Time's up — next set.";
      document.getElementById('timerToggle').textContent = 'Restart';
      return;
    }
    updateTimerDisplay();
  }, 1000);
}
function updateTimerDisplay(){
  const d = document.getElementById('timerDisplay'), ring = document.getElementById('timerRing');
  if (!d || !ring) return;
  d.textContent = `${String(Math.floor(state.timer.remaining/60)).padStart(2,'0')}:${String(state.timer.remaining%60).padStart(2,'0')}`;
  ring.style.strokeDashoffset = -(1 - state.timer.remaining/state.timer.total) * 282.7;
}
function closeTimer(){
  clearInterval(state.timer.intervalId);
  document.getElementById('timerModal').classList.add('hidden');
  if (!sess.active) document.body.style.overflow = '';
  document.getElementById('timerLabel').textContent = 'Breathe. Let your muscles recover.';
  document.getElementById('timerToggle').textContent = 'Pause';
}
function beep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.05; o.start();
    setTimeout(()=>{ o.stop(); ctx.close(); }, 220);
    if (navigator.vibrate) navigator.vibrate([60,40,60]);
  } catch {}
}

/* ============================================================
   8. NAV + INIT
   ============================================================ */

function updateStreakBadge(){
  const el = document.getElementById('streakCount');
  if (el) el.textContent = store.streak;
}

function navigate(page){
  state.page = page;
  ['home','workout','explorer','learn','progress'].forEach(p =>
    document.getElementById('page-'+p).classList.toggle('hidden', p !== page));
  const active = document.getElementById('page-'+page);
  active.classList.remove('page'); void active.offsetWidth; active.classList.add('page');

  if (page === 'home') renderHome();
  if (page === 'workout') renderWorkout();
  if (page === 'explorer') renderExplorer();
  if (page === 'learn') renderLearn();
  if (page === 'progress') renderProgress();

  document.querySelectorAll('.nav-btn').forEach(b => {
    const on = b.dataset.nav === page || (page === 'workout' && b.dataset.nav === 'home');
    b.style.color = on ? 'var(--accent)' : 'var(--text-dim)';
  });
  window.scrollTo({ top:0, behavior:'instant' });
}

function openSettings(){
  openSheet(`
    <h2 class="font-display font-black text-xl">Settings</h2>
    <div class="mt-4 space-y-2.5">
      <button class="card p-4 w-full text-left" onclick="closeSheet(); toggleBeginner(); navigate('home');">
        <div class="font-bold text-sm">Beginner mode: ${store.beginnerMode ? 'on' : 'off'}</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">${store.beginnerMode ? 'Hard lifts swapped for easier versions, 6 exercises per day.' : 'Full plan, including barbell squats, bench press and pull-ups.'}</p>
      </button>
      <button class="card p-4 w-full text-left" onclick="store.units = store.units==='kg'?'lb':'kg'; saveStore(); closeSheet(); toast('Now using ' + store.units);">
        <div class="font-bold text-sm">Weight units: ${store.units}</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">Tap to switch between kilograms and pounds.</p>
      </button>
      <button class="card p-4 w-full text-left" onclick="testImages()">
        <div class="font-bold text-sm">Check exercise animations</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">Tests whether the GIFs can reach this device, and tells you what to do if not.</p>
      </button>
      <button class="card p-4 w-full text-left" onclick="closeSheet(); navigate('learn');">
        <div class="font-bold text-sm">Gym basics</div>
        <p class="text-xs text-[var(--text-dim)] mt-1">Sets, reps, how heavy to lift, warming up, staying safe.</p>
      </button>
    </div>
    <button class="btn-ghost w-full py-3 mt-4 font-bold text-sm" data-close-sheet>Close</button>`);
}

function testImages(){
  const probe = EXERCISES['push-up'].gif;
  document.getElementById('sheetBody').innerHTML =
    '<h2 class="font-display font-black text-xl">Checking animations…</h2>' +
    '<p class="text-sm text-[var(--text-dim)] mt-2">Loading a test GIF from the CDN.</p>';
  const img = new Image();
  const finish = (ok, where) => {
    document.getElementById('sheetBody').innerHTML = ok
      ? '<h2 class="font-display font-black text-xl">Animations are working</h2>' +
        '<p class="text-sm text-[var(--text-dim)] mt-2">Loaded successfully from ' + where + '. If a particular exercise still shows a diagram, that one file is missing and everything else is fine.</p>' +
        '<img src="' + img.src + '" style="width:100%;border-radius:14px;margin-top:14px;background:#fff;">' +
        '<button class="btn-accent w-full py-3.5 mt-4 font-bold" data-close-sheet>Close</button>'
      : '<h2 class="font-display font-black text-xl">Animations are blocked</h2>' +
        '<p class="text-sm text-[var(--text-dim)] mt-2">This device or preview cannot reach the GIF host, so diagrams are shown instead. Saving this file and opening it directly in your browser normally fixes it. Everything else in the app works either way.</p>' +
        '<button class="btn-accent w-full py-3.5 mt-4 font-bold" data-close-sheet>Close</button>';
    document.querySelectorAll('#sheet [data-close-sheet]').forEach(b => b.addEventListener('click', closeSheet));
  };
  img.onload = () => finish(true, img.src.includes('jsdelivr') ? 'the jsDelivr CDN' : 'GitHub');
  img.onerror = () => {
    if (!img.dataset.retried){ img.dataset.retried = '1'; img.src = probe.replace(GIF, GIF_MIRROR); return; }
    finish(false);
  };
  img.dataset = img.dataset || {};
  img.src = probe;
}

function bindGlobal(){
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', ()=> navigate(b.dataset.nav)));
  document.querySelectorAll('[data-close-modal]').forEach(b => b.addEventListener('click', closeExerciseModal));
  document.querySelectorAll('#sheet [data-close-sheet]').forEach(b => b.addEventListener('click', closeSheet));
  document.getElementById('sheet').querySelector('.modal-backdrop').addEventListener('click', closeSheet);
  document.getElementById('btnSettings').addEventListener('click', openSettings);
  document.getElementById('btnStreak').addEventListener('click', ()=> navigate('progress'));

  document.querySelectorAll('[data-timer-preset]').forEach(b => b.addEventListener('click', ()=>{
    const s = parseInt(b.dataset.timerPreset,10);
    state.timer.total = s; state.timer.remaining = s; state.timer.paused = false;
    document.getElementById('timerLabel').textContent = 'Breathe. Let your muscles recover.';
    document.getElementById('timerToggle').textContent = 'Pause';
    updateTimerDisplay(); startTimerLoop();
  }));
  document.getElementById('timerToggle').addEventListener('click', ()=>{
    if (state.timer.remaining === 0){
      state.timer.remaining = state.timer.total; state.timer.paused = false;
      document.getElementById('timerLabel').textContent = 'Breathe. Let your muscles recover.';
      document.getElementById('timerToggle').textContent = 'Pause';
      startTimerLoop(); return;
    }
    state.timer.paused = !state.timer.paused;
    document.getElementById('timerToggle').textContent = state.timer.paused ? 'Resume' : 'Pause';
  });
  document.getElementById('timerClose').addEventListener('click', closeTimer);

  // Tap any underlined gym term, anywhere in the app
  document.addEventListener('click', e => {
    const t = e.target.closest('.jargon');
    if (t){ e.stopPropagation(); showDefinition(t.dataset.term); }
  });
}

function init(){
  bindGlobal();
  updateStreakBadge();
  navigate('home');
}
init();
</script>
