<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#08090E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="RYZE — a beginner-first gym trainer with 170+ exercises, 8 training plans and one-set-at-a-time guidance." />
<title>RYZE — Gym Trainer</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-0: #08090E;
    --bg-1: #0E1018;
    --surface: rgba(255,255,255,0.04);
    --surface-2: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #F5F6F8;
    --text-dim: #A1A6B3;
    --text-mute: #6B7080;
    --accent: #D4FF4F;
    --accent-soft: rgba(212,255,79,0.16);
    --accent-glow: rgba(212,255,79,0.35);
    --ink: #0a0a0a;
    --coral: #FF6B4A;
    --cyan: #4ADEFF;
    --gold: #FFCB47;
    --violet: #A78BFA;
    --easy: #4ADEFF;
    --med: #FFCB47;
    --hard: #FF6B4A;
  }

  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { overscroll-behavior-y: contain; }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg-0);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
    background-image:
      radial-gradient(1200px 600px at 20% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(74,222,255,0.05), transparent 60%),
      linear-gradient(180deg, #08090E 0%, #06070C 100%);
    background-attachment: fixed;
  }

  .font-display { font-family: 'Archivo', sans-serif; letter-spacing: -0.02em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.2em; color:var(--text-mute); }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .glass {
    background: var(--surface);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--border);
  }
  .glass-strong {
    background: rgba(16,18,26,0.86);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--border-strong);
  }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
    border: 1px solid var(--border);
    border-radius: 20px;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .2s;
  }
  .card:active { transform: scale(.985); }
  .card-flat { background: rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:16px; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 13px; border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    transition: all .2s; white-space: nowrap;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--ink); box-shadow: 0 0 24px var(--accent-glow); }
  .chip:active { transform: scale(.95); }
  .chip-sm { padding:6px 10px; font-size:11px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 4px 8px; border-radius: 6px;
  }
  .badge-easy   { background: rgba(74,222,255,0.12); color: var(--easy); border:1px solid rgba(74,222,255,0.25); }
  .badge-med    { background: rgba(255,203,71,0.12); color: var(--med);  border:1px solid rgba(255,203,71,0.25); }
  .badge-hard   { background: rgba(255,107,74,0.12); color: var(--hard); border:1px solid rgba(255,107,74,0.25); }
  .badge-muscle { background: rgba(255,255,255,0.05); color: var(--text-dim); border:1px solid var(--border); }

  .btn-accent {
    background: var(--accent); color: var(--ink); font-weight: 700; border-radius: 14px;
    transition: transform .15s, box-shadow .2s; box-shadow: 0 8px 30px -8px var(--accent-glow);
  }
  .btn-accent:active { transform: scale(.97); }
  .btn-accent:disabled { opacity: .4; box-shadow: none; }

  .btn-ghost {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--text); border-radius: 14px; transition: all .2s;
  }
  .btn-ghost:active { transform: scale(.97); background: rgba(255,255,255,0.08); }

  .seg-ctrl { display:flex; gap:4px; padding:4px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:14px; }
  .seg-ctrl button { flex:1; padding:9px 6px; border-radius:10px; font-size:12px; font-weight:700; color:var(--text-dim); transition:all .2s; }
  .seg-ctrl button.on { background:var(--accent); color:var(--ink); }

  .page { animation: pageIn .3s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 100%);
    background-size: 200% 100%; animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .live-dot { animation: livePulse 1.6s ease-in-out infinite; }

  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .breathe { animation: breathe 2.6s ease-in-out infinite; transform-origin: center; }

  @keyframes flicker { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.08) rotate(2deg); } }
  .flicker { animation: flicker 1.4s ease-in-out infinite; transform-origin: bottom center; }

  .scroll-x { display: flex; gap: 8px; overflow-x: auto; padding: 4px; -webkit-overflow-scrolling: touch; }

  .ex-img-wrap {
    position: relative; overflow: hidden; border-radius: 16px;
    background: linear-gradient(135deg, rgba(212,255,79,0.04), rgba(74,222,255,0.04));
    border: 1px solid var(--border); aspect-ratio: 4/3;
  }
  .ex-img-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .ex-img-wrap svg.fallback { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ex-img-wrap .skeleton-layer { position: absolute; inset: 0; transition: opacity .3s; }

  .nav-pad { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }

  .modal-backdrop { background: rgba(2,3,7,0.72); backdrop-filter: blur(10px); }
  .modal-sheet { animation: sheetUp .32s cubic-bezier(.2,.7,.2,1) both; max-height: 92vh; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }

  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .pop { animation: pop .35s cubic-bezier(.2,.7,.2,1) both; }

  .exercise-done { opacity: 0.5; }
  .today-glow { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 14px 50px -14px var(--accent-glow); }

  button { user-select: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  .jargon {
    color: var(--text); font: inherit; padding: 0;
    border-bottom: 1px dashed var(--accent-glow);
    background: none; cursor: pointer;
  }
  .jargon:active { color: var(--accent); }

  #session {
    position: fixed; inset: 0; z-index: 70;
    background: var(--bg-0);
    background-image:
      radial-gradient(900px 500px at 50% -10%, var(--accent-soft), transparent 60%),
      linear-gradient(180deg, #0A0B11 0%, #06070C 100%);
    display: flex; flex-direction: column;
  }
  #session.hidden { display: none; }
  .hidden { display: none !important; }
  #session .sess-body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 20px calc(20px + env(safe-area-inset-bottom));
  }
  #session .sess-foot {
    padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: rgba(10,11,17,0.9);
    backdrop-filter: blur(20px);
  }
  .seg-track { display: flex; gap: 3px; }
  .seg { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.10); transition: background .3s; }
  .seg.done { background: var(--accent); }
  .seg.now  { background: var(--accent-glow); }

  .stepper {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 16px; padding: 6px;
  }
  .stepper button {
    width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    font-size: 22px; font-weight: 700; line-height: 1; color: var(--text);
  }
  .stepper button:active { background: var(--accent); color: var(--ink); }
  .stepper .val { text-align: center; flex: 1; min-width: 0; }

  .set-pip {
    flex: 1; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-mute);
  }
  .set-pip.done { background: var(--accent-soft); border-color: var(--accent-glow); color: var(--accent); }
  .set-pip.now  { background: var(--accent); border-color: var(--accent); color: var(--ink); }

  .kv { display: flex; justify-content: space-between; align-items: baseline; gap:10px; padding: 9px 0; border-bottom: 1px dashed rgba(255,255,255,0.07); }
  .kv:last-child { border-bottom: none; }

  .rpe-btn { flex:1; padding:9px 0; border-radius:10px; font-size:11px; font-weight:700; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text-dim); }
  .rpe-btn.on { background:var(--accent); color:var(--ink); border-color:var(--accent); }

  .plate { display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:8px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; color:var(--ink); min-width:38px; padding:8px 6px; }

  input[type=text], input[type=number], input[type=search], textarea, select { font-family:inherit; }
  input::placeholder { color: var(--text-mute); }

  .hm-cell { aspect-ratio:1; border-radius:4px; background:rgba(255,255,255,0.04); border:1px solid var(--border); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<body class="text-white">

<div id="app" class="relative z-10 max-w-[480px] mx-auto">

  <header class="sticky top-0 z-40 px-5 pt-4 pb-3 glass-strong" style="border-bottom:1px solid var(--border);">
    <div class="flex items-center justify-between">
      <button onclick="navigate('home')" class="flex items-center gap-2.5 text-left">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center font-display font-black text-lg" style="background:var(--accent); color:var(--ink);">R</div>
        <div>
          <div class="font-display font-black text-[17px] leading-none tracking-tight">RYZE</div>
          <div id="planTag" class="text-[10px] text-[var(--text-mute)] font-mono uppercase tracking-widest mt-0.5">Train · Track · Rise</div>
        </div>
      </button>
      <div class="flex items-center gap-2">
        <button id="btnStreak" aria-label="Streak" class="glass px-2.5 py-1.5 rounded-full flex items-center gap-1.5 text-xs font-bold">
          <span class="flicker">🔥</span><span id="streakCount">0</span>
        </button>
        <button id="btnSettings" aria-label="Settings" class="glass w-9 h-9 rounded-full flex items-center justify-center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="px-5 nav-pad">
    <section id="page-home" class="page py-5"></section>
    <section id="page-workout" class="page py-5 hidden"></section>
    <section id="page-library" class="page py-5 hidden"></section>
    <section id="page-learn" class="page py-5 hidden"></section>
    <section id="page-progress" class="page py-5 hidden"></section>
    <section id="page-tools" class="page py-5 hidden"></section>
    <section id="page-plans" class="page py-5 hidden"></section>
    <section id="page-builder" class="page py-5 hidden"></section>
    <section id="page-history" class="page py-5 hidden"></section>
  </main>

  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-40 px-4" style="padding-bottom: calc(12px + env(safe-area-inset-bottom));">
    <div class="glass-strong rounded-2xl flex items-center justify-around py-2 px-1" style="box-shadow: 0 -10px 40px -10px rgba(0,0,0,0.6);">
      <button data-nav="home" class="nav-btn flex-1 py-2 rounded-xl flex flex-col items-center gap-0.5 text-[9px] font-bold uppercase tracking-wider">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
        Today
      </button>
      <button data-nav="library" class="nav-btn flex-1 py-2 rounded-xl flex flex-col items-center gap-0.5 text-[9px] font-bold uppercase tracking-wider">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Moves
      </button>
      <button data-nav="progress" class="nav-btn flex-1 py-2 rounded-xl flex flex-col items-center gap-0.5 text-[9px] font-bold uppercase tracking-wider">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>
        Progress
      </button>
      <button data-nav="learn" class="nav-btn flex-1 py-2 rounded-xl flex flex-col items-center gap-0.5 text-[9px] font-bold uppercase tracking-wider">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M9 8h6"/></svg>
        Basics
      </button>
      <button data-nav="tools" class="nav-btn flex-1 py-2 rounded-xl flex flex-col items-center gap-0.5 text-[9px] font-bold uppercase tracking-wider">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 1 5.4-5.4z"/></svg>
        Tools
      </button>
    </div>
  </nav>

  <div id="exerciseModal" class="fixed inset-0 z-[80] hidden flex items-end justify-center">
    <div class="modal-backdrop absolute inset-0" data-close-modal></div>
    <div class="modal-sheet relative w-full max-w-[480px] glass-strong rounded-t-3xl overflow-hidden" style="border-bottom:none;">
      <div class="absolute top-2.5 left-1/2 -translate-x-1/2 w-10 h-1 rounded-full bg-white/20 z-10"></div>
      <button class="absolute top-3 right-3 w-9 h-9 rounded-full glass flex items-center justify-center z-10" data-close-modal aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="exerciseModalBody" class="overflow-y-auto no-scrollbar" style="max-height:92vh;"></div>
    </div>
  </div>

  <div id="sheet" class="fixed inset-0 z-[90] hidden flex items-end justify-center">
    <div class="modal-backdrop absolute inset-0" data-close-sheet></div>
    <div class="modal-sheet relative w-full max-w-[480px] glass-strong rounded-t-3xl overflow-hidden" style="border-bottom:none;">
      <div class="absolute top-2.5 left-1/2 -translate-x-1/2 w-10 h-1 rounded-full bg-white/20 z-10"></div>
      <div id="sheetBody" class="overflow-y-auto no-scrollbar p-5 pt-7" style="max-height:88vh;"></div>
    </div>
  </div>

  <div id="timerModal" class="fixed inset-0 z-[85] hidden flex items-center justify-center">
    <div class="modal-backdrop absolute inset-0"></div>
    <div class="relative w-[88%] max-w-[360px] glass-strong rounded-3xl p-6 text-center">
      <div class="eyebrow">Rest timer</div>
      <div class="text-xs text-[var(--text-dim)] mt-1" id="timerLabel">Breathe. Let your muscles recover.</div>
      <div class="relative w-[190px] h-[190px] mx-auto my-5">
        <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">
          <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
          <circle id="timerRing" cx="50" cy="50" r="45" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0" style="transition: stroke-dashoffset .95s linear;"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <div id="timerDisplay" class="font-display font-black text-5xl tabular-nums">00:30</div>
          <div class="eyebrow mt-1">remaining</div>
        </div>
      </div>
      <div class="grid grid-cols-4 gap-2 mb-4">
        <button class="btn-ghost py-2 text-xs font-bold" data-timer-preset="30">30s</button>
        <button class="btn-ghost py-2 text-xs font-bold" data-timer-preset="60">60s</button>
        <button class="btn-ghost py-2 text-xs font-bold" data-timer-preset="90">90s</button>
        <button class="btn-ghost py-2 text-xs font-bold" data-timer-preset="120">2m</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button id="timerToggle" class="btn-accent py-3 font-bold text-sm">Pause</button>
        <button id="timerClose" class="btn-ghost py-3 font-bold text-sm">Close</button>
      </div>
    </div>
  </div>

  <div id="session" class="hidden"></div>

  <div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[100] hidden" style="bottom: calc(96px + env(safe-area-inset-bottom));">
    <div class="glass-strong rounded-full px-4 py-2.5 text-sm font-semibold whitespace-nowrap" id="toastText"></div>
  </div>

</div>

<script>
/* ============================================================
   RYZE v3 — beginner-first gym trainer
   1  Glossary + jargon engine data
   2  Exercise library (170+ moves)
   3  Plans, sessions, lessons
   4  Storage + state
   5  Images
   6  Helpers
   7  Pages
   8  Guided session
   9  Tools, sheets, timers
   10 Nav + init
   ============================================================ */

/* ============================================================
   1. GLOSSARY
   ============================================================ */

const DEFS = {
  rep: { t:'Rep (repetition)', d:'One complete movement. Lower the weight and push it back up once = 1 rep.' },
  set: { t:'Set', d:'A group of reps done back-to-back without stopping. "3 sets of 10" means do 10 reps, rest, and repeat that twice more.' },
  rest: { t:'Rest', d:'The break between sets. Sitting still doing nothing is correct — it lets your muscles refill their energy so the next set is strong.' },
  'rep range': { t:'Rep range', d:'A target like 8–12. Pick a weight where you can hit at least the bottom number with good form. Once you can hit the top number on every set, add a little weight next time.' },
  'progressive overload': { t:'Progressive overload', d:'The whole point of lifting: do slightly more over time — more weight, more reps, or better control. Without it, your body has no reason to change.' },
  form: { t:'Form', d:'How you perform the movement. Good form = the right muscle works and your joints stay safe. Always beats lifting heavy.' },
  'good form': { t:'Good form', d:'Controlled movement, full range, no jerking or bouncing. If your form breaks, the set is over — that rep does not count.' },
  hinge: { t:'Hip hinge', d:'Pushing your hips backwards (like closing a car door with your bum) while your back stays flat. Your knees bend only a little. This is not a squat.' },
  squat: { t:'Squat', d:'Sitting down and standing up against resistance. Hips and knees both bend a lot.' },
  brace: { t:'Brace', d:'Tighten your stomach like someone is about to poke you. It protects your lower back.' },
  eccentric: { t:'Eccentric (the lowering part)', d:'The half of the rep where the weight goes down. Take 2–3 seconds here — it builds a lot of muscle and most beginners rush it.' },
  concentric: { t:'Concentric (the lifting part)', d:'The half of the rep where you push or pull the weight. Move it with intent, but never by throwing it.' },
  lockout: { t:'Lockout', d:'The end of the rep where your arms or legs are straight. "Don\'t lock out hard" means straighten without slamming the joint.' },
  supinate: { t:'Supinate', d:'Rotate your palm so it faces up towards the ceiling.' },
  pronate: { t:'Pronate', d:'Rotate your palm so it faces down towards the floor.' },
  'neutral spine': { t:'Neutral spine', d:'Your back keeps its natural slight curve — not rounded like a prawn, not arched like a banana.' },
  'neutral grip': { t:'Neutral grip', d:'Palms facing each other, thumbs up. Usually the friendliest grip for sore shoulders and elbows.' },
  lats: { t:'Lats', d:'The big fan-shaped back muscles under your armpits. They pull your elbows down and back.' },
  'rear delts': { t:'Rear delts', d:'The back of your shoulder. Small, often ignored, and great for posture.' },
  traps: { t:'Traps', d:'The diamond-shaped muscle from your neck across your upper back. It shrugs and stabilises your shoulder blades.' },
  quads: { t:'Quads', d:'The muscles on the front of your thigh. They straighten your knee.' },
  hamstrings: { t:'Hamstrings', d:'The muscles on the back of your thigh. They bend your knee and help you hinge.' },
  glutes: { t:'Glutes', d:'Your bum muscles. The strongest muscle group you own.' },
  core: { t:'Core', d:'Everything around your middle — abs, sides and lower back — working together to stop your torso wobbling.' },
  parallel: { t:'Parallel', d:'Level with the floor. "Squat to parallel" = go down until the crease of your hip is level with your knee.' },
  'range of motion': { t:'Range of motion', d:'How far the weight travels. Full range beats half reps almost every time.' },
  failure: { t:'Failure', d:'The point where you physically cannot do another rep. As a beginner, stop 1–2 reps before this.' },
  RIR: { t:'RIR (reps in reserve)', d:'How many more reps you could have done. 2 RIR means you stopped two short of failure. Most of your sets should live at 1–3 RIR.' },
  RPE: { t:'RPE (how hard it felt)', d:'A 1–10 rating of set difficulty. 10 = could not do another rep. 8 = two left in the tank. Logging it teaches you what weights to pick.' },
  DOMS: { t:'DOMS (muscle soreness)', d:'Delayed onset muscle soreness — the ache that shows up 1–2 days after training. Normal, especially early on. It is not a measure of a good workout.' },
  spotter: { t:'Spotter', d:'Someone who stands over you ready to help lift the bar if you get stuck. Ask any staff member — it is completely normal.' },
  compound: { t:'Compound exercise', d:'A move that uses several joints and muscles at once, like a squat or a row. Do these first, when you are fresh.' },
  isolation: { t:'Isolation exercise', d:'A move that targets one muscle, like a bicep curl. Do these at the end.' },
  warmup: { t:'Warm-up', d:'Easy movement plus a couple of light sets before your working sets. It wakes up the muscle and cuts your injury risk.' },
  tempo: { t:'Tempo', d:'How fast you move. A good default: 2 seconds down, no pause, 1 second up.' },
  superset: { t:'Superset', d:'Two exercises done back-to-back with no rest between them. Saves time; raises your heart rate.' },
  dropset: { t:'Drop set', d:'Finish a set, immediately strip some weight, and keep going. A finishing technique — not for your main lifts.' },
  '1RM': { t:'1RM (one-rep max)', d:'The heaviest weight you could lift once. You never need to test it — this app estimates it from your normal sets.' },
  volume: { t:'Volume', d:'Weight × reps × sets, added up. It is the crude measure of how much work you did, and it should creep up over months.' },
  deload: { t:'Deload', d:'A planned easy week — same exercises, roughly half the weight or sets. Take one when everything feels heavy and your sleep is poor.' },
  'working set': { t:'Working set', d:'A real set at a challenging weight. Light warm-up sets do not count and are not logged.' },
  cadence: { t:'Cadence', d:'Your rhythm on a bike or rower — how many revolutions or strokes per minute you hold.' },

/* ============================================================
   LESSONS + ACHIEVEMENTS
   ============================================================ */

const LESSONS = [
  { icon:'🔢', t:'Sets, reps and rest', d:`A <b>rep</b> is one full movement. A <b>set</b> is a batch of reps done without stopping. "3 × 10" means three sets of ten reps.

Between sets you rest. That break is not laziness — it lets your muscles refill their energy so the next set is actually productive. Big movements like squats need 2–3 minutes. Small ones like curls need about 60 seconds.

A rep range like 8–12 means: pick a weight where you can manage at least 8 with good form. When you can hit 12 on every set, add a small amount of weight next session.` },

  { icon:'⚖️', t:'How heavy should I lift?', d:`Nobody can tell you your numbers — you find them by testing. Here is the method:

Do your first set with a weight you are confident is easy. Count how many reps you could still have done at the end.

• Could have done 5+ more → go up meaningfully next set.
• Could have done 3–4 more → go up a little.
• Could have done 1–2 more → that is your working weight.
• Could not finish the reps → go lighter, no ego.

Aim to finish every set with 1–2 reps left in the tank. Your first two weeks are for finding these numbers. That is a productive use of time, not a wasted session.` },

  { icon:'📈', t:'Why you must add weight over time', d:`Your body only changes when you give it a reason. Doing the same 10kg for ten weeks tells it nothing needs to change.

<b>Progressive overload</b> means doing slightly more over time. In practice: hit the top of your rep range on every set, then add the smallest available increase next time — usually 2.5kg on a barbell, or one notch on a machine.

Progress is not always weight. More reps, better control, or a deeper range all count. This app flags an exercise as "ready for more" the moment you hit the top of the range on every set.` },

  { icon:'🔥', t:'Warming up (do not skip this)', d:`Two parts, five to ten minutes total:

1. Get warm. Five minutes on a bike, rower or treadmill until your breathing changes slightly.

2. Warm up the actual lift. Before your working sets, do 1–3 sets of the same exercise with much lighter weight. For example, before benching 40kg: 10 reps with the empty bar, then 5 reps at 30kg, then start.

These light sets do not count as working sets and are not logged. There is a warm-up set calculator in Tools that works out the jumps for you.` },

  { icon:'😣', t:'Soreness, and when to worry', d:`Aching muscles a day or two after training is <b>DOMS</b>. It is normal, especially in your first few weeks, and it fades as your body adapts. It is not a scorecard — a session without soreness can still be excellent.

Train anyway if you are just sore. Move gently and it usually improves.

Stop and get it checked if you feel sharp pain during a movement, pain in a joint rather than a muscle, anything that gets worse as you continue, or pain that lingers past a week.` },

  { icon:'🫁', t:'Breathing', d:`Simple rule: breathe in as the weight comes down, breathe out as you push or pull it.

Never hold your breath through an entire heavy set — it spikes your blood pressure and can make you light-headed.

For heavy squats and deadlifts, take a breath at the top, hold it briefly as you brace your stomach, then breathe out at the end of the rep.` },

  { icon:'🛟', t:'Staying safe on your own', d:`Bench press: use a rack with the safety bars set just below your chest, or ask a member of staff for a <b>spotter</b>. Asking is completely normal and nobody minds.

Squats: set the safety bars to just below your lowest position. Then a failed rep just means you set the bar down.

As a beginner, stop 1–2 reps before you cannot do another. You get almost all the benefit and almost none of the risk.

Clip the collars on. Put your weights back.` },

  { icon:'🤷', t:'What if I cannot do an exercise?', d:`This is normal and it is not a problem. Almost every exercise in this app has an easier version.

During a session, tap <b>Swap</b> on any exercise to see an easier or harder alternative, or to skip it entirely.

Machine occupied? Do a later exercise first and come back. The order is a suggestion, not a rule.

Cannot do a single pull-up? Almost nobody can at first. Use the lat pulldown or the assisted machine — same muscles, achievable today.` },

  { icon:'📅', t:'Choosing a plan', d:`There are nine plans in this app and the best one is the one you will actually turn up for.

• New to all of this → Full Body 3-Day, or Machines Only if the gym floor feels intimidating.
• Three or four days free → Upper/Lower 4-Day is the sweet spot.
• Five days and enjoying it → Push/Pull/Legs, or One Muscle a Day.
• Training at home → Home (No Equipment) or Dumbbells Only.
• Want to get strong on a few lifts → Barbell Strength.

Switch plans from Today → Change plan. Your history and personal bests carry across.` },

  { icon:'🍽️', t:'Eating for this', d:`No app can calculate your body for you, but three things are true for almost everyone:

<b>Protein.</b> Roughly 1.6g per kilo of bodyweight per day supports muscle growth. For a 70kg person that is about 110g. Spread it across your meals.

<b>Calories.</b> To build muscle you need a small surplus; to lose fat, a small deficit. Small is the key word — extreme either way costs you muscle or sanity.

<b>Water.</b> Dehydration makes training feel harder than it is. Bring a bottle.

If you have a medical condition or are making big dietary changes, talk to a doctor or a registered dietitian rather than an app.` },

  { icon:'😴', t:'Sleep and recovery', d:`Muscle is built while you sleep, not while you lift. Seven to nine hours does more for your results than any supplement.

Signs you need a lighter week: weights that felt fine now feel heavy, your motivation has vanished, you are sleeping badly, or small niggles are stacking up.

The fix is a <b>deload</b>: same exercises, roughly half the sets or 60% of the weight, for one week. You will come back stronger, not weaker.` },

  { icon:'🧭', t:'Gym etiquette', d:`Nobody is watching you. Everyone is looking at their own phone or their own set.

Put your weights back. This is the only rule everyone genuinely cares about.

Ask to share equipment — "how many sets have you got left?" is normal and welcome. People work in together all the time.

Wipe down benches. Do not stand directly in front of the dumbbell rack. Do not film other people.` },

  { icon:'📊', t:'Reading your own numbers', d:`This app tracks three things worth understanding.

<b>Estimated 1RM</b> is the heaviest single rep you could probably do, worked out from your normal sets. You never need to test it. When it drifts up, you are getting stronger.

<b>Volume</b> is weight × reps × sets added together. It is a crude measure of how much work you did. Over months it should creep up.

<b>RPE</b> is how hard the set felt, from 1 to 10. Logging it teaches you to pick weights well, which is the single most useful skill in the gym.` },

}

function mountImage(container, ex){
  if (!container || !ex) return;
  container.classList.add('ex-img-wrap');

  const showFallback = () => {
    container.innerHTML = muscleSVG(ex.muscle, ex.name);
    if (!imageWarningShown){
      imageWarningShown = true;
      setTimeout(()=> toast('Animations unavailable — showing diagrams'), 600);
    }
  };
  if (!ex.gif || isKnownBroken(ex.gif)) return showFallback();

  container.innerHTML =
    '<div class="skeleton skeleton-layer"></div>' +
    '<img alt="' + esc(ex.name) + '" decoding="async" referrerpolicy="no-referrer" ' +
    'style="opacity:0;transition:opacity .3s;" src="' + ex.gif + '">';

  const skel = container.querySelector('.skeleton-layer');
  const img  = container.querySelector('img');
  if (!img) return showFallback();

  img.addEventListener('load', ()=>{
    imageCache.set(ex.gif, 'ok');
    img.style.opacity = '1';
    if (skel){ skel.style.opacity = '0'; setTimeout(()=> skel.remove(), 320); }
  });

  img.addEventListener('error', ()=>{
    if (!img.dataset.retried && ex.gif.startsWith(GIF)){
      img.dataset.retried = '1';
      img.src = ex.gif.replace(GIF, GIF_MIRROR);
      return;
    }
    imageCache.set(ex.gif, 'fail');
    showFallback();
  });

  if (img.complete && img.naturalWidth > 0) img.dispatchEvent(new Event('load'));
}

/* ============================================================
   6. HELPERS
   ============================================================ */

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const TERM_KEYS = Object.keys(TERMS).sort((a,b)=> b.length - a.length);
function jargon(text){
  let out = esc(text);
  const found = [];
  TERM_KEYS.forEach(word => {
    const re = new RegExp('\\b(' + word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')\\b', 'i');
    out = out.replace(re, (m, g1) => { found.push([TERMS[word], g1]); return '\u0001' + (found.length-1) + '\u0002'; });
  });
  return out.replace(/\u0001(\d+)\u0002/g, (_,i) => {
    const [key, shown] = found[i];
    return `<button class="jargon" data-term="${key}">${shown}</button>`;
  });
}

function difficultyBadge(d){
  const map = { beginner:['badge-easy','Easy'], intermediate:['badge-med','Medium'], advanced:['badge-hard','Hard'] };
  const [cls,label] = map[d] || map.beginner;
  return `<span class="badge ${cls}">${label}</span>`;
}
const muscleColor = m => (MUSCLE_GROUPS.find(x=>x.id===m) || {color:'#D4FF4F'}).color;
const muscleLabel = m => (MUSCLE_GROUPS.find(x=>x.id===m) || {label:m}).label;
const muscleBadge = m => `<span class="badge badge-muscle" style="color:${muscleColor(m)};border-color:${muscleColor(m)}33;">${muscleLabel(m)}</span>`;

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.add('hidden'), 2200);
}

const isTimed = reps => /^\d+\s*(s|sec|m|min)/i.test(String(reps).trim());
function timedSeconds(reps){
  const s = String(reps).trim();
  const n = parseInt(s,10) || 30;
  return /m/i.test(s) && !/s/i.test(s) ? n*60 : n;
}
const isBodyweight = ex => ex.equipment === 'bodyweight' || ex.equipment === 'cardio machine';

function targetReps(reps){
  const nums = String(reps).match(/\d+/g);
  if (!nums) return 10;
  if (nums.length >= 2) return Math.round((+nums[0] + +nums[1]) / 2);
  return +nums[0];
}
function topOfRange(reps){
  const nums = String(reps).match(/\d+/g);
  if (!nums) return 12;
  return +nums[nums.length-1];
}

/* Epley estimate, capped at sensible rep counts */
function e1rm(w, r){
  if (!w || !r) return 0;
  if (r === 1) return w;
  return Math.round(w * (1 + Math.min(r,15)/30) * 10) / 10;
}

/* ---- Plan / session resolution ---- */
function getPlan(){ return PLANS[store.plan] || PLANS.ppl5; }
function customById(id){ return store.custom.find(c => c.id === id) || null; }

function sessionSlot(dayKey){
  if (Object.prototype.hasOwnProperty.call(store.overrides, dayKey)) return store.overrides[dayKey];
  return getPlan().sched[dayKey];
}
function rawSessionFor(dayKey){
  const slot = sessionSlot(dayKey);
  if (slot === -1 || slot === undefined || slot === null) return null;
  if (typeof slot === 'string' && slot.startsWith('c:')){
    const c = customById(slot.slice(2));
    return c ? { n:c.name, focus:c.focus||'Your own session', dur:c.dur||40, why:c.why||'You built this one yourself.', warm:WU.full, ex:c.ex, custom:true } : null;
  }
  return getPlan().sessions[slot] || null;
}
function sessionName(dayKey){ const s = rawSessionFor(dayKey); return s ? s.n : 'Rest Day'; }

const hasEquip = eq => store.equipment.includes(eq);

/* Find a substitute for an exercise the person cannot do with their kit */
function substituteFor(exId, used){
  const ex = EXERCISES[exId];
  if (!ex) return exId;
  const taken = used || new Set();
  if (hasEquip(ex.equipment)) return exId;

  const chain = [ex.easier, BEGINNER_SWAP[exId]].filter(Boolean);
  for (const alt of chain){
    if (EXERCISES[alt] && hasEquip(EXERCISES[alt].equipment) && !taken.has(alt)) return alt;
  }
  const build = fn => Object.values(EXERCISES)
    .filter(e => fn(e) && hasEquip(e.equipment) && e.id !== exId
                 && (e.muscle !== 'mobility' || ex.muscle === 'mobility'))
    .sort((a,b)=> rankDiff(a.difficulty) - rankDiff(b.difficulty));

  const same = build(e => e.muscle === ex.muscle);
  const near = build(e => e.secondary.includes(ex.muscle));
  const fresh = same.find(e => !taken.has(e.id)) || near.find(e => !taken.has(e.id));
  return (fresh || same[0] || near[0] || { id: exId }).id;
}
const rankDiff = d => ({beginner:0,intermediate:1,advanced:2}[d] ?? 1);

function restFor(seconds){
  if (store.restStyle === 'short') return Math.max(30, Math.round(seconds * 0.7));
  if (store.restStyle === 'long')  return Math.round(seconds * 1.3);
  return seconds;
}

/* Resolved exercise list for a day: beginner swaps, equipment swaps, dedupe */
function planFor(dayKey){
  const s = rawSessionFor(dayKey);
  if (!s) return [];
  let list = s.ex.map(e => ({ ...e, rest: restFor(e.rest) }));

  const used = new Set();
  list = list.map(e => {
    let id = e.id;
    if (store.beginnerMode && BEGINNER_SWAP[id] && EXERCISES[BEGINNER_SWAP[id]]) id = BEGINNER_SWAP[id];
    const sub = substituteFor(id, used);
    used.add(sub);
    return { ...e, id: sub, swapped: sub !== e.id, sets: store.beginnerMode ? Math.max(2, e.sets - 1) : e.sets };
  });

  const seen = new Set();
  list = list.filter(e => (seen.has(e.id) ? false : (seen.add(e.id), true)));
  if (store.beginnerMode) list = list.slice(0, 6);
  return list;
}

/* ---- Logs ---- */
function logFor(dayKey){
  const l = store.logs[todayKey()];
  return (l && l.dayKey === dayKey) ? l : null;
}
function setsDone(dayKey, exId){
  const l = logFor(dayKey);
  return (l && l.ex[exId]) ? l.ex[exId].length : 0;
}
function lastPerformance(exId){
  const dates = Object.keys(store.logs).sort().reverse();
  for (const d of dates) {
    if (d === todayKey()) continue;
    const rec = store.logs[d].ex[exId];
    if (rec && rec.length) return { date: d, sets: rec };
  }
  return null;
}
function historyFor(exId){
  return Object.keys(store.logs).sort().map(d=>{
    const sets = store.logs[d].ex[exId];
    if (!sets || !sets.length) return null;
    const top = sets.reduce((a,b)=> (e1rm(b.w,b.r) > e1rm(a.w,a.r) ? b : a), sets[0]);
    const vol = sets.reduce((a,s)=> a + (s.w||0)*(s.r||0), 0);
    return { date:d, top, vol, sets };
  }).filter(Boolean);
}
function dayVolume(log){
  if (!log) return 0;
  return Object.values(log.ex).reduce((a,sets)=> a + sets.reduce((b,s)=> b + (s.w||0)*(s.r||0), 0), 0);
}
function daySets(log){
  if (!log) return 0;
  return Object.values(log.ex).reduce((a,b)=> a + b.length, 0);
}

/* Should this exercise go up in weight next time? */
function progressionHint(exId, reps){
  const last = lastPerformance(exId);
  if (!last) return null;
  const top = topOfRange(reps);
  const allHit = last.sets.every(s => s.r >= top);
  if (allHit && last.sets[0].w) {
    const bump = last.sets[0].w >= 60 ? 5 : 2.5;
    return { ready:true, next: Math.round((last.sets[0].w + bump)*10)/10, from:last.sets[0].w };
  }
  return { ready:false, from:last.sets[last.sets.length-1].w };
}

function fmtW(w){
  if (!w) return 'bw';
  return (Math.round(w*10)/10) + store.units;
}
function fmtDate(d){
  return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}
function formatDate(){
  return new Date().toLocaleDateString('en-GB', { weekday:'long', month:'short', day:'numeric' });
}
function mmss(s){
  s = Math.max(0, Math.round(s));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

/* ---- Tiny SVG line chart ---- */
function sparkline(points, opts={}){
  if (!points.length) return '';
  const w = opts.w || 320, h = opts.h || 110, pad = 8;
  const xs = points.map((_,i)=> pad + i*( (w-pad*2) / Math.max(1, points.length-1) ));
  const min = Math.min(...points), max = Math.max(...points);
  const span = (max - min) || 1;
  const ys = points.map(v => h - pad - ((v - min)/span) * (h - pad*2));
  const d = xs.map((x,i)=> (i?'L':'M') + x.toFixed(1) + ',' + ys[i].toFixed(1)).join(' ');
  const area = d + ` L${xs[xs.length-1].toFixed(1)},${h-pad} L${xs[0].toFixed(1)},${h-pad} Z`;
  const dots = xs.map((x,i)=> `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="2.5" fill="var(--accent)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
    <defs><linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#sparkFill)"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

function barChart(values, labels){
  const max = Math.max(...values, 1);
  return `<div class="flex items-end gap-1.5" style="height:96px;">
    ${values.map((v,i)=>`<div class="flex-1 flex flex-col items-center justify-end h-full gap-1">
      <div style="width:100%;height:${Math.max(2,(v/max)*76)}px;border-radius:5px 5px 2px 2px;background:${v?'linear-gradient(180deg,var(--accent),var(--accent-soft))':'rgba(255,255,255,0.06)'};"></div>
      <div class="text-[8px] font-mono text-[var(--text-mute)]">${labels[i]}</div>
    </div>`).join('')}
  </div>`;
}

function libraryList(){
  const q = state.libSearch.trim().toLowerCase();
  return Object.values(EXERCISES).filter(ex => {

    if (state.libEquip !== 'all' && ex.equipment !== state.libEquip) return false;
    if (state.libFavsOnly && !store.favs.includes(ex.id)) return false;
    if (q && !(ex.name.toLowerCase().includes(q) || ex.muscle.includes(q) || ex.equipment.includes(q) || (ex.plain||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function setDraft(i, field, val){
  const d = state.builderDraft;
  d.ex[i][field] = field === 'reps' ? val : (parseInt(val,10) || 0);
}
function moveDraft(i, dir){
  const d = state.builderDraft, j = i + dir;
  if (j < 0 || j >= d.ex.length) return;
  [d.ex[i], d.ex[j]] = [d.ex[j], d.ex[i]];
  renderBuilder();
}
function removeDraft(i){ state.builderDraft.ex.splice(i,1); renderBuilder(); }

function saveCustom(andStart){
  const d = state.builderDraft;
  d.name = (document.getElementById('cbName')?.value || 'My workout').trim();
  d.focus = (document.getElementById('cbFocus')?.value || '').trim();
  if (!d.ex.length){ toast('Add at least one exercise first'); return; }
  d.dur = Math.max(15, Math.round(d.ex.reduce((a,e)=> a + e.sets * ((e.rest||60) + 40) / 60, 0)));
  const idx = store.custom.findIndex(c => c.id === d.id);
  if (idx >= 0) store.custom[idx] = d; else store.custom.push(d);
  saveStore();
  toast('Workout saved');
  if (andStart) startCustom(d.id); else navigate('home');
}
function deleteCustom(id){
  if (!confirm('Delete this workout? Logged sets stay in your history.')) return;
  store.custom = store.custom.filter(c => c.id !== id);
  Object.keys(store.overrides).forEach(k => { if (store.overrides[k] === 'c:'+id) delete store.overrides[k]; });
  saveStore(); toast('Deleted'); navigate('home');
}
function startCustom(id){
  const today = dayOfWeek();
  store.overrides[today] = 'c:' + id;
  saveStore();
  startSession(today);
}

function progressWeek(){
  const week = [];
  for (let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = dateKey(d);
    week.push({ date:d, key, log: store.logs[key] });
  }
  const weekSets = week.reduce((a,d)=> a + daySets(d.log), 0);
  const weekVol  = week.reduce((a,d)=> a + dayVolume(d.log), 0);

  /* last 8 weeks of volume */
  const weeks = [], labels = [];
  for (let w=7; w>=0; w--){
    let vol = 0;
    for (let d=0; d<7; d++){
      const dt = new Date(); dt.setDate(dt.getDate() - (w*7 + d));
      vol += dayVolume(store.logs[dateKey(dt)]);
    }
    weeks.push(Math.round(vol));
    labels.push(w === 0 ? 'now' : '-' + w + 'w');
  }

  /* sets per muscle group, last 30 days */
  const byMuscle = {};
  for (let i=0;i<30;i++){
    const dt = new Date(); dt.setDate(dt.getDate()-i);
    const log = store.logs[dateKey(dt)];
    if (!log) continue;
    Object.entries(log.ex).forEach(([id,sets])=>{
      const ex = EXERCISES[id]; if (!ex) return;
      byMuscle[ex.muscle] = (byMuscle[ex.muscle]||0) + sets.length;
    });
  }
  const muscleRows = Object.entries(byMuscle).sort((a,b)=>b[1]-a[1]);
  const muscleMax = Math.max(1, ...muscleRows.map(r=>r[1]));

  return `
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="glass rounded-2xl p-4">
        <div class="eyebrow">Current streak</div>
        <div class="font-display font-black text-4xl mt-1 tabular-nums">${store.streak}<span class="text-base text-[var(--text-mute)]"> days</span></div>
        <div class="text-xs text-[var(--text-dim)] mt-1">${store.streak > 0 ? 'Keep it going' : 'Finish a session to start one'}</div>
      </div>
      <div class="glass rounded-2xl p-4">
        <div class="eyebrow">Workouts done</div>
        <div class="font-display font-black text-4xl mt-1 tabular-nums">${store.totalWorkouts}</div>
        <div class="text-xs text-[var(--text-dim)] mt-1">${store.totalSets} sets in total</div>
      </div>
    </div>

    <div class="glass rounded-2xl p-4 mb-4">
      <div class="flex items-baseline justify-between mb-3">
        <h2 class="font-bold text-sm">Last 7 days</h2>
        <span class="eyebrow">${weekSets} sets · ${Math.round(weekVol).toLocaleString()}${store.units}</span>
      </div>
      <div class="grid grid-cols-7 gap-2">
        ${week.map(d=>{
          const n = daySets(d.log);
          const inten = Math.min(n/15, 1);
          const isToday = d.key === todayKey();
          return `<div class="text-center">
            <div class="aspect-square rounded-lg flex items-center justify-center font-display font-black text-xs"
                 style="background:${n>0?hexA(ACCENTS[store.accent].accent, 0.18+inten*0.6):'rgba(255,255,255,0.04)'};
                        border:1px solid ${isToday?'var(--accent)':(n>0?'var(--accent-glow)':'var(--border)')};
                        color:${inten>0.3?'var(--ink)':'var(--text)'};">${n||'·'}</div>
            <div class="text-[9px] font-mono uppercase text-[var(--text-mute)] mt-1">${['S','M','T','W','T','F','S'][d.date.getDay()]}</div>
          </div>`;
        }).join('')}
      </div>
      <p class="text-[11px] text-[var(--text-dim)] mt-3">Each square shows how many sets you logged that day.</p>
    </div>

    <div class="glass rounded-2xl p-4 mb-4">
      <div class="flex items-baseline justify-between mb-3">
        <h2 class="font-bold text-sm">Weekly volume</h2>
        <span class="eyebrow">weight × reps</span>
      </div>
      ${barChart(weeks, labels)}
      <p class="text-[11px] text-[var(--text-dim)] mt-3">${weeks[7] > weeks[6] && weeks[6] > 0
        ? 'Up on last week. That is progressive overload doing its job.'
        : 'Volume naturally rises and falls. Look at the shape over months, not weeks.'}</p>
    </div>

    ${muscleRows.length ? `<div class="glass rounded-2xl p-4 mb-4">
      <h2 class="font-bold text-sm mb-3">Sets per muscle · last 30 days</h2>
      <div class="space-y-2">
        ${muscleRows.map(([m,n])=>`
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-mono uppercase tracking-wider w-20 flex-shrink-0 truncate" style="color:${muscleColor(m)};">${muscleLabel(m)}</span>
            <div class="flex-1 h-2.5 rounded-full overflow-hidden" style="background:rgba(255,255,255,0.06);">
              <div style="width:${(n/muscleMax*100).toFixed(0)}%;height:100%;background:${muscleColor(m)};border-radius:99px;"></div>
            </div>
            <span class="font-mono text-[11px] w-6 text-right">${n}</span>
          </div>`).join('')}
      </div>
      <p class="text-[11px] text-[var(--text-dim)] mt-3">Roughly 10–20 sets per muscle per week is the usual target. Anything at zero is being missed.</p>
    </div>` : ''}

    <div class="glass rounded-2xl p-4">
      <h2 class="font-bold text-sm mb-2">All time</h2>
      <div class="kv"><span class="text-sm text-[var(--text-dim)]">Total volume lifted</span><span class="font-display font-black">${Math.round(store.totalVolume||0).toLocaleString()}${store.units}</span></div>
      <div class="kv"><span class="text-sm text-[var(--text-dim)]">Total sets</span><span class="font-display font-black">${store.totalSets}</span></div>
      <div class="kv"><span class="text-sm text-[var(--text-dim)]">Exercises tried</span><span class="font-display font-black">${Object.keys(store.best).length}</span></div>
      <div class="kv"><span class="text-sm text-[var(--text-dim)]">Days logged</span><span class="font-display font-black">${Object.keys(store.logs).length}</span></div>
    </div>
  `;
}

function progressLifts(){
  const bests = Object.entries(store.best)
    .filter(([id])=> EXERCISES[id])
    .sort((a,b)=> (b[1].e1rm||b[1].w||0)-(a[1].e1rm||a[1].w||0));

/* --- Plate calculator --- */
const PLATE_SETS = {
  kg: [25,20,15,10,5,2.5,1.25],
  lb: [45,35,25,10,5,2.5],
};
const PLATE_COLOUR = { 25:'#EF4444', 20:'#3B82F6', 15:'#EAB308', 10:'#22C55E', 5:'#F5F5F5', 2.5:'#EF4444', 1.25:'#C0C0C0', 45:'#3B82F6', 35:'#EAB308', 25.5:'#22C55E' };

function plateSolve(target, bar){
  const each = (target - bar) / 2;
  if (each <= 0) return { ok:false, each:0, plates:[] };
  let left = each; const plates = [];
  PLATE_SETS[store.units].forEach(p=>{
    while (left >= p - 0.001){ plates.push(p); left = Math.round((left - p)*100)/100; }
  });
  return { ok:true, each, plates, leftover: Math.round(left*100)/100 };
}

function openPlateCalc(target){
  const bar = store.units === 'kg' ? 20 : 45;
  openSheet(`
    <h2 class="font-display font-black text-xl">Plate calculator</h2>
    <p class="text-sm text-[var(--text-dim)] mt-1.5">Enter the total weight you want on the bar, including the bar itself.</p>
    <div class="grid grid-cols-2 gap-2 mt-4">
      <label class="card-flat p-3"><span class="eyebrow">Target total</span>
        <input id="pcTarget" type="number" step="0.5" inputmode="decimal" value="${target||60}" class="w-full bg-transparent font-display font-black text-2xl outline-none"/></label>
      <label class="card-flat p-3"><span class="eyebrow">Bar weight</span>
        <input id="pcBar" type="number" step="0.5" inputmode="decimal" value="${bar}" class="w-full bg-transparent font-display font-black text-2xl outline-none"/></label>
    </div>
    <div id="pcOut" class="mt-4"></div>
    <button class="btn-accent w-full py-3.5 mt-4 font-bold" data-close-sheet>Done</button>`);
  const update = ()=>{
    const t = parseFloat(document.getElementById('pcTarget').value) || 0;
    const b = parseFloat(document.getElementById('pcBar').value) || 0;
    const r = plateSolve(t, b);
    const out = document.getElementById('pcOut');
    if (!r.ok){ out.innerHTML = `<div class="card p-4"><p class="text-sm text-[var(--text-dim)]">That is lighter than the bar. Use dumbbells, or just the empty bar — which is a real ${b}${store.units}.</p></div>`; return; }
    out.innerHTML = `<div class="card p-4">
      <div class="eyebrow mb-2">Per side — ${r.each}${store.units}</div>
      <div class="flex flex-wrap gap-1.5">
        ${r.plates.length ? r.plates.map(p=>`<span class="plate" style="background:${PLATE_COLOUR[p]||'#94A3B8'};">${p}</span>`).join('')
          : '<span class="text-sm text-[var(--text-dim)]">Just the bar.</span>'}
      </div>
      ${r.leftover ? `<p class="text-[11px] mt-3" style="color:var(--gold);">${r.leftover}${store.units} per side cannot be made with standard plates — round to ${Math.round((t - r.leftover*2)*10)/10}${store.units}.</p>` : ''}
      <p class="text-[11px] text-[var(--text-dim)] mt-3">Load the heaviest plates first, closest to the middle, then clip the collars on.</p>
    </div>`;
  };
  document.getElementById('pcTarget').addEventListener('input', update);
  document.getElementById('pcBar').addEventListener('input', update);
  update();
}

/* ============================================================
   9. GUIDED SESSION — one set at a time
   ============================================================ */

const sess = {
  active:false, dayKey:null, steps:[], i:0,
  resting:false, restLeft:0, restTotal:0, restId:null,
  setLeft:0, setId:null, setRunning:false,
  rpe:null, startedAt:null,
};
let wakeLock = null;

async function requestWakeLock(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
function releaseWakeLock(){ try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }

function buildSteps(dayKey){
  const plan = planFor(dayKey);
  const steps = [{ type:'warmup' }];
  plan.forEach(e => {
    for (let s = 1; s <= e.sets; s++){
      steps.push({ type:'set', exId:e.id, setNo:s, sets:e.sets, reps:e.reps, rest:e.rest });
    }
  });
  steps.push({ type:'finish' });
  return steps;
}

function startSession(dayKey){
  const plan = planFor(dayKey);
  if (!plan.length){ openDaySheet(dayKey); return; }

  sess.dayKey = dayKey;
  sess.steps = buildSteps(dayKey);
  sess.active = true;
  sess.resting = false;
  sess.rpe = null;
  sess.startedAt = Date.now();

  const log = logFor(dayKey);
  if (log) {
    const counted = {};
    let resumeAt = 1;
    for (let i = 1; i < sess.steps.length; i++){
      const st = sess.steps[i];
      if (st.type !== 'set') break;
      counted[st.exId] = (counted[st.exId] || 0) + 1;
      const have = (log.ex[st.exId] || []).length;
      if (counted[st.exId] <= have) resumeAt = i + 1; else break;
    }
    sess.i = resumeAt;
  } else {
    sess.i = 0;
  }

  state.selectedDay = dayKey;
  document.getElementById('session').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  requestWakeLock();
  renderSession();
}

function exitSession(){
  stopRest(); stopSetTimer(); releaseWakeLock();
  sess.active = false;
  document.getElementById('session').classList.add('hidden');
  document.body.style.overflow = '';
  navigate(state.page === 'workout' ? 'workout' : 'home');
}

function confirmExit(){
  const doneNow = totalLoggedToday();
  if (doneNow === 0) return exitSession();
  openSheet(`
    <h2 class="font-display font-black text-xl">Leave this workout?</h2>
    <p class="text-sm text-[var(--text-dim)] mt-2">Your ${doneNow} logged ${doneNow===1?'set is':'sets are'} saved. You can pick up exactly where you left off later today.</p>
    <div class="grid grid-cols-2 gap-2 mt-5">
      <button class="btn-ghost py-3 font-bold text-sm" data-close-sheet>Carry on training</button>
      <button class="btn-accent py-3 font-bold text-sm" onclick="closeSheet(); exitSession();">Leave</button>
    </div>`);
}

function totalLoggedToday(){ return daySets(logFor(sess.dayKey)); }

function sessionProgress(){
  const setSteps = sess.steps.filter(s => s.type === 'set');
  let doneCount = sess.steps.slice(0, sess.i).filter(s => s.type === 'set').length;
  if (sess.resting) doneCount += 1;
  return { total:setSteps.length, done:Math.min(doneCount, setSteps.length) };
}

function sessHeader(title, sub){
  const p = sessionProgress();
  return `
  <div class="px-5 pt-4 pb-3" style="padding-top:calc(14px + env(safe-area-inset-top));">
    <div class="flex items-center justify-between mb-3">
      <button onclick="confirmExit()" aria-label="Leave workout" class="w-9 h-9 rounded-full glass flex items-center justify-center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="text-center px-2 min-w-0">
        <div class="eyebrow truncate">${esc(title)}</div>
        <div class="text-xs font-bold mt-0.5 truncate">${esc(sub)}</div>
      </div>
      <button onclick="openTimer(90)" aria-label="Rest timer" class="w-9 h-9 rounded-full glass flex items-center justify-center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
    </div>
    <div class="seg-track">
      ${sess.steps.filter(s=>s.type==='set').map((_,idx)=>
        `<span class="seg ${idx < p.done ? 'done' : (idx === p.done ? 'now' : '')}"></span>`).join('')}
    </div>
    <div class="eyebrow mt-1.5 text-center">${p.done} of ${p.total} sets done</div>
  </div>`;
}

function renderSession(){
  const root = document.getElementById('session');
  const step = sess.steps[sess.i];
  if (!step) return exitSession();
  if (sess.resting) return renderRest();
  if (step.type === 'warmup') return renderWarmupStep(root);
  if (step.type === 'finish') return renderFinishStep(root);
  return renderSetStep(root, step);
}

function renderWarmupStep(root){
  const s = rawSessionFor(sess.dayKey);

  const first = EXERCISES[plan[0].id];

function renderSetStep(root, step){
  const ex = EXERCISES[step.exId];
  const last = lastPerformance(step.exId);
  const loggedSets = (logFor(sess.dayKey)?.ex[step.exId]) || [];
  const bodyweight = isBodyweight(ex);
  const timed = isTimed(step.reps);
  const hint = progressionHint(step.exId, step.reps);

  let defW = '';
  if (loggedSets.length) defW = loggedSets[loggedSets.length-1].w || '';
  else if (hint && hint.ready) defW = hint.next;

  const defR = timed ? timedSeconds(step.reps) : targetReps(step.reps);

  const upNext = sess.steps[sess.i+1];
  const upNextLabel = upNext && upNext.type==='set'
    ? (upNext.exId === step.exId ? `Set ${upNext.setNo} of the same exercise` : EXERCISES[upNext.exId].name)

      <div class="card p-4 mt-4">
        <div class="kv"><span class="text-sm text-[var(--text-dim)]">Target this set</span><span class="font-display font-black text-lg">${timed ? esc(step.reps) : esc(step.reps) + ' reps'}</span></div>
        <div class="kv"><span class="text-sm text-[var(--text-dim)]">Rest afterwards</span><span class="font-display font-black text-lg">${step.rest}s</span></div>
        ${last ? `<div class="kv"><span class="text-sm text-[var(--text-dim)]">Last time</span><span class="font-mono text-sm text-right">${last.sets.map(s=> fmtW(s.w)+'×'+s.r).join(', ')}</span></div>` : ''}
        ${loggedSets.length ? `<div class="kv"><span class="text-sm text-[var(--text-dim)]">Earlier today</span><span class="font-mono text-sm text-right">${loggedSets.map(s=> fmtW(s.w)+'×'+s.r).join(', ')}</span></div>` : ''}
      </div>

      ${hint && hint.ready && !loggedSets.length ? `<div class="card p-4 mt-3" style="border-color:var(--accent-glow);background:var(--accent-soft);">
        <div class="flex gap-2"><span>📈</span><div>

        </div></div></div>` : ''}

      ${!last && !bodyweight ? `<div class="card p-4 mt-3" style="border-color:rgba(255,203,71,0.3);">

          <div>
            <div class="eyebrow mb-1.5">Weight (${store.units})</div>

  mountImage(document.getElementById('sessImg'), ex);

    btn.addEventListener('click', ()=> toggleSetTimer(defR));
  }

function setRPE(v){
  sess.rpe = (sess.rpe === v) ? null : v;
  document.querySelectorAll('.rpe-btn').forEach(b => b.classList.toggle('on', b.textContent.trim().startsWith(sess.rpe||'###')));
}
function toggleFav(id){
  if (store.favs.includes(id)) store.favs = store.favs.filter(x=>x!==id);
  else store.favs.push(id);
  saveStore();
  toast(store.favs.includes(id) ? 'Saved to your list' : 'Removed from your list');
  if (sess.active) renderSession(); else if (state.page === 'library') renderLibraryResults();
}
function plateHelp(){
  const w = parseFloat(document.getElementById('inW')?.value) || 60;
  openPlateCalc(w);
}

function bump(which, delta){
  const input = document.getElementById(which === 'w' ? 'inW' : 'inR');
  if (!input) return;
  let v = parseFloat(input.value);
  if (isNaN(v)) v = 0;
  v = Math.max(0, Math.round((v + delta) * 100) / 100);
  input.value = v;
}

function toggleSetTimer(total){
  const btn = document.getElementById('setTimerBtn');
  const disp = document.getElementById('setTimerDisplay');
  if (sess.setRunning){ stopSetTimer(); btn.textContent = 'Resume'; return; }
  sess.setRunning = true;
  btn.textContent = 'Pause';
  sess.setId = setInterval(()=>{
    sess.setLeft--;
    if (disp) disp.textContent = mmss(sess.setLeft);
    if (sess.setLeft <= 0){ stopSetTimer(); beep(); logSet(); }
  }, 1000);
}
function stopSetTimer(){ clearInterval(sess.setId); sess.setRunning = false; }

function logSet(){
  const step = sess.steps[sess.i];
  if (!step || step.type !== 'set') return;
  const wEl = document.getElementById('inW');
  const rEl = document.getElementById('inR');
  const nEl = document.getElementById('inNote');
  const w = wEl ? (parseFloat(wEl.value) || 0) : 0;
  const r = rEl ? (parseInt(rEl.value,10) || 0)
                : (isTimed(step.reps) ? timedSeconds(step.reps) : targetReps(step.reps));

  if (nEl){
    const note = nEl.value.trim();
    if (note) store.notes[step.exId] = note; else delete store.notes[step.exId];
  }

  const key = todayKey();
  if (!store.logs[key] || store.logs[key].dayKey !== sess.dayKey){
    store.logs[key] = { dayKey: sess.dayKey, plan: store.plan, session: sessionName(sess.dayKey), ex: {} };
  }
  const log = store.logs[key];
  if (!log.ex[step.exId]) log.ex[step.exId] = [];
  const entry = { w, r };
  if (sess.rpe) entry.rpe = sess.rpe;
  log.ex[step.exId].push(entry);

  const est = e1rm(w, r);
  const b = store.best[step.exId];
  const isPR = !b || est > (b.e1rm || 0) || (!b.w && r > b.r);
  if (isPR) store.best[step.exId] = { w, r, e1rm: est, date: key };

  store.totalSets += 1;
  store.totalVolume = (store.totalVolume || 0) + w * r;
  sess.rpe = null;
  saveStore();
  stopSetTimer();
  if (isPR && w > 0 && b) toast('New best on ' + EXERCISES[step.exId].name + ' 🎉');

  const next = sess.steps[sess.i + 1];
  if (next && next.type === 'set' && store.autoRest && step.rest > 0){
    startRest(step.rest);
  } else {
    sess.i += 1;
    renderSession();
  }
}

function startRest(seconds){
  sess.resting = true;
  sess.restLeft = seconds;
  sess.restTotal = seconds;
  renderRest();
  clearInterval(sess.restId);
  sess.restId = setInterval(()=>{
    sess.restLeft--;
    const d = document.getElementById('restDisplay');
    if (d) d.textContent = mmss(sess.restLeft);
    const ring = document.getElementById('restRing');
    if (ring && sess.restTotal) ring.style.strokeDashoffset = -(1 - sess.restLeft/sess.restTotal) * 282.7;
    if (sess.restLeft <= 0){ stopRest(); beep(); endRest(); }
  }, 1000);
}
function stopRest(){ clearInterval(sess.restId); }
function endRest(){ stopRest(); sess.resting = false; sess.i += 1; renderSession(); }
function addRest(s){
  sess.restLeft += s; sess.restTotal += s;
  const d = document.getElementById('restDisplay');
  if (d) d.textContent = mmss(sess.restLeft);
}

function undoLastSet(){
  const step = sess.steps[sess.i];
  const log = logFor(sess.dayKey);
  if (log && log.ex[step.exId] && log.ex[step.exId].length){
    const removed = log.ex[step.exId].pop();
    store.totalSets = Math.max(0, store.totalSets - 1);
    store.totalVolume = Math.max(0, (store.totalVolume||0) - (removed.w||0)*(removed.r||0));
    saveStore();
  }
  stopRest(); sess.resting = false;
  renderSession();
  toast('Set removed — log it again');
}

function addExtraSet(){
  const step = sess.steps[sess.i];
  sess.steps.splice(sess.i + 1, 0, { ...step, setNo: step.setNo + 1, sets: step.sets + 1 });
  for (let i = sess.i; i < sess.steps.length; i++){
    if (sess.steps[i].type === 'set' && sess.steps[i].exId === step.exId) sess.steps[i].sets = step.sets + 1;
  }
  toast('Extra set added');
  renderSession();
}

function renderFinishStep(root){
  const log = logFor(sess.dayKey) || { ex:{} };
  const done = Object.entries(log.ex);
  const setCount = daySets(log);
  const vol = Math.round(dayVolume(log));
  const mins = sess.startedAt ? Math.max(1, Math.round((Date.now()-sess.startedAt)/60000)) : null;

  const key = todayKey();
  if (store.lastWorkoutDate !== key && setCount > 0){
    store.totalWorkouts += 1;
    const y = new Date(); y.setDate(y.getDate()-1);
    store.streak = (store.lastWorkoutDate === dateKey(y)) ? store.streak + 1 : 1;
    store.lastWorkoutDate = key;
    const focus = (rawSessionFor(sess.dayKey)?.focus || '').toLowerCase();
    if (/quad|leg|glute|hamstring/.test(focus)) store.legDays = (store.legDays||0) + 1;
    saveStore();
    updateStreakBadge();
    checkAchievements();
  }

  root.innerHTML = `
    ${sessHeader(DAY_LONG[sess.dayKey], 'Finished')}
    <div class="sess-body">
      <div class="text-center mt-4 mb-5">
        <div class="text-5xl mb-3 pop">🏆</div>
        <h1 class="font-display font-black text-[28px] leading-tight">That's the session done</h1>
        <p class="text-sm text-[var(--text-dim)] mt-2">${setCount} sets logged${mins?` in ${mins} minutes`:''}. Write nothing down — it is all saved.</p>

        <div class="glass rounded-xl py-3"><div class="font-display font-black text-xl">${setCount}</div><div class="eyebrow">sets</div></div>
        <div class="glass rounded-xl py-3"><div class="font-display font-black text-xl">${vol ? vol.toLocaleString() : '—'}</div><div class="eyebrow">${store.units} moved</div></div>
        <div class="glass rounded-xl py-3"><div class="font-display font-black text-xl">${store.streak}</div><div class="eyebrow">day streak</div></div>
      </div>

      <div class="card p-4 mb-4">
        <div class="eyebrow mb-2">What you did</div>
        ${done.length ? done.map(([id,sets])=>`
          <div class="kv"><span class="text-sm min-w-0 truncate pr-2">${esc(EXERCISES[id] ? EXERCISES[id].name : id)}</span>
          <span class="font-mono text-xs text-[var(--text-dim)] flex-shrink-0">${sets.map(s=>fmtW(s.w)+'×'+s.r).join(' · ')}</span></div>
        `).join('') : '<p class="text-sm text-[var(--text-dim)]">No sets logged this time.</p>'}

      <div class="card p-4 mb-4">
        <div class="flex items-center gap-2 mb-1.5"><span>📈</span><h3 class="font-bold text-sm">Next time</h3></div>
        <p class="text-sm text-[var(--text-dim)] leading-relaxed">${jargon('Any exercise where you hit the top of the rep range on every set is ready for more weight — add the smallest jump available, usually 2.5kg. Everything else stays the same until it is. That is progressive overload, and it is the entire game.')}</p>
      </div>

      <div class="card p-4">
        <div class="flex items-center gap-2 mb-1.5"><span>🍽️</span><h3 class="font-bold text-sm">Now recover</h3></div>
        <p class="text-sm text-[var(--text-dim)] leading-relaxed">Eat a proper meal with protein in it within a few hours, drink water, and sleep. Soreness in a day or two is normal and nothing to worry about.</p>
      </div>
      <div class="h-4"></div>
    </div>
    <div class="sess-foot">
      <button onclick="exitSession()" class="btn-accent w-full py-4 font-bold text-[15px]">Done</button>
    </div>`;
}

function checkAchievements(){
  const newly = ACHIEVEMENTS.filter(a => a.test(store) && !store.earned.includes(a.id));
  if (!newly.length) return;
  store.earned.push(...newly.map(a=>a.id));
  saveStore();
  setTimeout(()=> toast(newly[0].icon + '  Badge earned: ' + newly[0].t), 1200);
}

function doSkip(exId){
  closeSheet();
  sess.steps = sess.steps.filter((s,idx)=> idx < sess.i || !(s.type==='set' && s.exId===exId));
  sess.resting = false; stopRest();
  if (sess.i >= sess.steps.length) sess.i = sess.steps.length - 1;
  renderSession();
  toast('Skipped');
}

function doSwap(oldId, newId){
  closeSheet();
  if (!EXERCISES[newId]) return;
  for (let i = sess.i; i < sess.steps.length; i++){
    if (sess.steps[i].type === 'set' && sess.steps[i].exId === oldId) sess.steps[i].exId = newId;
  }
  renderSession();
  toast('Swapped to ' + EXERCISES[newId].name);
}
