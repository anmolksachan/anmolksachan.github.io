<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" role="img" aria-label="Anmol K Sachan — Security Researcher, Pentester, Bug Bounty Hunter">
  <title>Anmol K Sachan — Security Researcher · Pentester · Bug Bounty Hunter</title>
  <style>
    :root {
      --bg:      #0b0f14;
      --bg2:     #121820;
      --accent:  #00e5b0;
      --accent2: #a78bfa;
      --text:    #e6edf3;
      --muted:   #7d8590;
      --grid:    rgba(0,229,176,0.10);
      --dim:     rgba(0,229,176,0.22);
      --border:  rgba(0,229,176,0.28);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:      #fbfcfd;
        --bg2:     #eef2f6;
        --accent:  #0d7a5f;
        --accent2: #6d28d9;
        --text:    #0d1117;
        --muted:   #57606a;
        --grid:    rgba(13,122,95,0.12);
        --dim:     rgba(13,122,95,0.25);
        --border:  rgba(13,122,95,0.35);
      }
    }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; }
    .bg   { fill: var(--bg); }
    .bg2  { fill: var(--bg2); }
    .acc  { fill: var(--accent); }
    .acc2 { fill: var(--accent2); }
    .txt  { fill: var(--text); }
    .mut  { fill: var(--muted); }
    .gridf{ fill: var(--grid); }
    .s-acc{ stroke: var(--accent); fill: none; }
    .s-dim{ stroke: var(--dim); fill: none; }
    .s-bor{ stroke: var(--border); fill: none; }
    .st-acc { stop-color: var(--accent); }

    @keyframes blink   { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes scan    { 0% { transform: translateY(-70px) } 100% { transform: translateY(300px) } }
    @keyframes glitchA {
      0%,86%,100% { opacity: 0; transform: translate(0,0) }
      87% { opacity: .85; transform: translate(-3px, 1px) }
      88% { opacity: 0 }
      90% { opacity: .7;  transform: translate(2px, -1px) }
      91% { opacity: 0 }
    }
    @keyframes glitchB {
      0%,86%,100% { opacity: 0; transform: translate(0,0) }
      87% { opacity: .85; transform: translate(3px, -1px) }
      88% { opacity: 0 }
      90% { opacity: .7;  transform: translate(-2px, 1px) }
      91% { opacity: 0 }
    }
    .cursor  { animation: blink 1s step-end infinite; }
    .scan    { animation: scan 7s linear infinite; }
    .glitchA { animation: glitchA 7s linear infinite; }
    .glitchB { animation: glitchB 7s linear infinite; }
  </style>

  <defs>
    <clipPath id="frame"><rect width="1000" height="280" rx="14"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.9" class="gridf"/>
    </pattern>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   class="st-acc" stop-opacity="0"/>
      <stop offset=".85" class="st-acc" stop-opacity=".07"/>
      <stop offset="1"   class="st-acc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="st-acc" stop-opacity=".9"/>
      <stop offset="1" class="st-acc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="62" y1="12" x2="18" y2="-58">
      <stop offset="0" class="st-acc" stop-opacity=".45"/>
      <stop offset="1" class="st-acc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="radarFill" cx="0" cy="0" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="st-acc" stop-opacity=".08"/>
      <stop offset="1" class="st-acc" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="typing">
      <rect x="82" y="70" height="24" width="0">
        <animate attributeName="width" begin="0.4s" dur="0.9s" fill="freeze" calcMode="discrete"
                 keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333;1"
                 values="0;8.4;16.8;25.2;33.6;42;50.4"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="1000" height="280" class="bg"/>
    <rect width="1000" height="280" fill="url(#dots)"/>
    <rect class="scan" x="0" y="0" width="1000" height="70" fill="url(#scanGrad)"/>

    <!-- Window chrome -->
    <rect width="1000" height="36" class="bg2"/>
    <line x1="0" y1="36" x2="1000" y2="36" class="s-bor" stroke-width="1"/>
    <circle cx="22" cy="18" r="5.5" fill="#ff5f56" opacity=".9"/>
    <circle cx="42" cy="18" r="5.5" fill="#ffbd2e" opacity=".9"/>
    <circle cx="62" cy="18" r="5.5" fill="#27c93f" opacity=".9"/>
    <text x="500" y="22.5" text-anchor="middle" class="mono mut" font-size="12">fr13nd0x7f@kali: ~/recon</text>
    <text x="984" y="22.5" text-anchor="end" class="mono mut" font-size="11" opacity=".7">zsh</text>

    <!-- Prompt 1: whoami -->
    <text x="48" y="66" class="mono" font-size="14">
      <tspan class="acc">┌──(</tspan><tspan class="acc2" font-weight="700">fr13nd0x7f㉿kali</tspan><tspan class="acc">)-[</tspan><tspan class="txt">~</tspan><tspan class="acc">]</tspan>
    </text>
    <text x="48" y="88" class="mono acc" font-size="14" textLength="25.2" lengthAdjust="spacingAndGlyphs">└─$</text>
    <text x="82" y="88" class="mono txt" font-size="14" textLength="50.4" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing)">whoami</text>
    <rect x="82" y="75" width="8" height="16" rx="1" class="acc">
      <animate attributeName="x" begin="0.4s" dur="0.9s" fill="freeze" calcMode="discrete"
               keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333;1"
               values="82;90.4;98.8;107.2;115.6;124;132.4"/>
      <set attributeName="opacity" to="0" begin="1.4s" fill="freeze"/>
    </rect>

    <!-- Output: name -->
    <g opacity="0">
      <animate attributeName="opacity" begin="1.4s" dur="0.45s" fill="freeze"
               values="0;1;0.2;1;0.5;1" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
      <text x="48" y="142" class="mono acc" font-size="46" font-weight="700" textLength="400" lengthAdjust="spacingAndGlyphs" filter="url(#glow)" opacity=".35">Anmol K Sachan</text>
      <text x="48" y="142" class="mono acc2 glitchA" font-size="46" font-weight="700" textLength="400" lengthAdjust="spacingAndGlyphs">Anmol K Sachan</text>
      <text x="48" y="142" class="mono acc glitchB" font-size="46" font-weight="700" textLength="400" lengthAdjust="spacingAndGlyphs">Anmol K Sachan</text>
      <text x="48" y="142" class="mono txt" font-size="46" font-weight="700" textLength="400" lengthAdjust="spacingAndGlyphs">Anmol K Sachan</text>
    </g>

    <!-- Output: roles -->
    <g opacity="0">
      <animate attributeName="opacity" begin="1.75s" dur="0.4s" fill="freeze" values="0;1"/>
      <rect x="48" y="153" width="400" height="1.5" fill="url(#underline)"/>
      <text x="48" y="180" class="mono" font-size="14" style="white-space:pre"><tspan class="acc">▸ </tspan><tspan class="txt">Security Researcher</tspan><tspan class="acc2">  //  </tspan><tspan class="txt">Pentester</tspan><tspan class="acc2">  //  </tspan><tspan class="txt">Bug Bounty Hunter</tspan></text>
    </g>

    <!-- Prompt 2: idle cursor -->
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="2.1s" fill="freeze"/>
      <text x="48" y="212" class="mono" font-size="14">
        <tspan class="acc">┌──(</tspan><tspan class="acc2" font-weight="700">fr13nd0x7f㉿kali</tspan><tspan class="acc">)-[</tspan><tspan class="txt">~</tspan><tspan class="acc">]</tspan>
      </text>
      <text x="48" y="233" class="mono acc" font-size="14" textLength="25.2" lengthAdjust="spacingAndGlyphs">└─$</text>
      <rect class="cursor acc" x="82" y="220" width="8" height="16" rx="1"/>
    </g>

    <!-- Radar -->
    <g transform="translate(838,146)">
      <circle r="92" fill="url(#radarFill)"/>
      <circle r="92" class="s-dim" stroke-width="5" stroke-dasharray="1.5 6.53"/>
      <circle r="84" class="s-bor" stroke-width="1"/>
      <circle r="56" class="s-dim" stroke-width="1"/>
      <circle r="28" class="s-dim" stroke-width="1"/>
      <line x1="-92" y1="0" x2="92" y2="0" class="s-dim" stroke-width="1"/>
      <line x1="0" y1="-92" x2="0" y2="92" class="s-dim" stroke-width="1"/>
      <text x="-92" y="-100" class="mono mut" font-size="9" letter-spacing="2">ATTACK SURFACE</text>
      <text x="92"  y="-100" text-anchor="end" class="mono acc" font-size="9" letter-spacing="1">● LIVE</text>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
        <path d="M0,0 L84,0 A84,84 0 0,0 42,-72.7 Z" fill="url(#sweep)"/>
        <line x1="0" y1="0" x2="84" y2="0" class="s-acc" stroke-width="1.5"/>
      </g>

      <!-- Blips flash as the sweep passes them -->
      <g opacity=".15">
        <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.083;0.088;0.588;1" values=".15;.15;1;.15;.15"/>
        <circle cx="48.5" cy="28" r="3" class="acc"/>
        <text x="55" y="31" class="mono acc" font-size="9">XSS</text>
      </g>
      <g opacity=".15">
        <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.347;0.352;0.852;1" values=".15;.15;1;.15;.15"/>
        <circle cx="-40.2" cy="57.3" r="3" class="acc2"/>
        <text x="-34" y="60.5" class="mono acc2" font-size="9">IDOR</text>
      </g>
      <g opacity=".3">
        <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.088;0.583;0.588;1" values=".3;.15;.15;1;.3"/>
        <circle cx="-32.9" cy="-19" r="3" class="acc"/>
        <text x="-27" y="-15.5" class="mono acc" font-size="9">SSRF</text>
      </g>
      <g opacity=".72">
        <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.338;0.833;0.838;1" values=".72;.15;.15;1;.72"/>
        <circle cx="38" cy="-65.8" r="3" class="acc2"/>
        <text x="44" y="-62.5" class="mono acc2" font-size="9">RCE</text>
      </g>

      <circle r="3" class="acc"/>
    </g>

    <!-- tmux-style status bar -->
    <rect x="0" y="248" width="1000" height="32" class="bg2"/>
    <line x1="0" y1="248" x2="1000" y2="248" class="s-bor" stroke-width="1"/>
    <rect x="0" y="248" width="92" height="32" class="acc"/>
    <text x="46" y="268.5" text-anchor="middle" class="mono bg" font-size="11" font-weight="700" letter-spacing="1.5">◉ RECON</text>
    <text x="108" y="268.5" class="mono" font-size="11.5" style="white-space:pre"><tspan class="acc" font-weight="700">0:research*</tspan><tspan class="mut">   1:pentest   2:bug-bounty   3:report</tspan></text>
    <text x="984" y="268.5" text-anchor="end" class="mono mut" font-size="11.5">
      <tspan>0x7F </tspan><tspan class="acc2">≡</tspan><tspan> 127.0.0.1 </tspan><tspan class="acc2">≡</tspan><tspan class="acc"> ~/home</tspan>
    </text>
  </g>

  <!-- Frame border -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="14" class="s-bor" stroke-width="1"/>
</svg>
